    sen: new Map(),
    plx: new Map(),
    nbm: new Map(),
    eqx: new Map(),
  };
  // 회사코드(KR0001…) 기반 매칭. 새 마스터(CSM_waterfall.json)가 코드↔이름 등록부.
  const codeToName = {};   // 'KR0001' → '메리츠화재해상보험'
  const nbByCode = {};     // 'KR0008' → NB spec (boot에서 NB_LOOKUP를 코드로 재키잉)

  // 표시용 회사명 정리 — 드롭다운/차트 타이틀 등 텍스트 출력에만 적용. coName 자체(keyColorOf·
  // PAA_ONLY 조회 키)는 원래 이름 유지 — 브랜드 컬러맵·PAA 예외 Set이 원수사명 기준이라 그대로 둬야 함.
  const NAME_ABBR = {
    '케이비손해보험':'KB손보', '케이비라이프생명보험':'KB라이프', '신한이지손해보험':'신한EZ손해',
    '에이비엘생명보험':'ABL생명', '케이디비생명보험':'KDB생명', '아이엠라이프생명보험':'iM라이프',
    '디지비생명보험':'DGB생명', '엠지손해보험':'MG손보', '에이아이지손해보험':'AIG손보',
    '에이아이에이생명보험':'AIA생명',
    '비엔피파리바카디프생명보험':'BNP카디프생명', '교보라이프플래닛생명보험':'교보라이프플래닛',
    '처브라이프생명보험':'처브라이프', '메트라이프생명보험':'메트라이프', '악사손해보험':'악사손보',
    '신한라이프생명보험':'신한라이프', '푸본현대생명보험':'푸본현대',
  };
  function shortName(n){
    if (!n) return n;
    if (NAME_ABBR[n]) return NAME_ABBR[n];
    return String(n)
      .replace(/화재해상보험$/, '화재')   // 메리츠화재해상보험 → 메리츠화재
      .replace(/해상화재보험$/, '해상')   // 현대해상화재보험 → 현대해상
      .replace(/손해보험$/, '손보')
      .replace(/생명보험$/, '생명')
      .replace(/재보험$/, '')             // 코리안리재보험 → 코리안리
      .replace(/보증보험$/, '보증');
  }

  function parseKoNum(x){
    if (x == null) return null;
    if (x === "" || x === "-") return null;
    let s = String(x).trim();
    let neg = false;
    s = s.replace(/,/g, "");
    if (/^\(.+\)$/.test(s)) { neg=true; s=s.slice(1,-1); }
    const n = Number(String(s).replace(/[^0-9.+-]/g, ""));
    if (Number.isNaN(n)) return null;
    return neg ? -n : n;
  }

  function fmtNum(v, maxFrac){
    if (v == null || v === "") return "-";
    if (typeof v === "number"){
      if (!Number.isFinite(v)) return "-";
      const neg = v < 0, a = Math.abs(v);
      const hasFrac = Math.abs(a % 1) > 1e-9;
      const out = a.toLocaleString("ko-KR", hasFrac ? { minimumFractionDigits:0, maximumFractionDigits:maxFrac||2 } : {});
      return neg ? "△" + out : out; // 회계 세모 표기
    }
    const n = parseKoNum(v);
    return n == null ? String(v) : fmtNum(n, maxFrac);
  }

  function indexRows(rows){
    const m=new Map();
    for (const row of rows || []){
      if (!row || !row.company) continue;
      if (!m.has(row.company)) m.set(row.company, []);
      m.get(row.company).push(row);
    }
    return m;
  }

  function firstRow(m,name){
    const a=m.get(name);
    return (a&&a.length)? a[0] : null;
  }

  function destroyCharts(){
    for (const k of ["wf","pl"]){ // ECharts
      if (charts[k]){ try{ charts[k].dispose(); }catch(e){} charts[k]=null; }
    }
    for (const k of ["amort","nb","hist"]){ // Chart.js
      try{ charts[k] && charts[k].destroy(); }catch(e){}
      charts[k]=null;
    }
  }

  function fetchFirst(paths){
    if (!paths || !paths.length) return Promise.reject(new Error("no paths"));
    const [head, ...rest] = paths;
    return fetch(head).then(r=>{
      if (!r.ok) throw new Error("HTTP "+r.status+" "+head);
      return r.json();
    }).catch(err=> rest.length ? fetchFirst(rest) : Promise.reject(err));
  }

  async function fetchJsonSafe(pathsOrUrl){
    const paths = Array.isArray(pathsOrUrl) ? pathsOrUrl : [pathsOrUrl];
    try{
      return await fetchFirst(paths);
    }catch(e){
      console.warn(e);
      return null;
    }
  }

  // ===== Panel 1: windowed CSM waterfall (company × period[year/quarter]) =====
  // Source = long-format CSM_waterfall.json: rows of {원수사명, 공시분기, 항목번호, 값}.
  // 항목번호 1=기초 2=신계약 3=이자 4=가정·경험 5=상각 6=기말. 값 단위 = 억원.
  // Quarter mode needs per-quarter (당분기) movements; current file is YTD(연 누계),
  // so quarter mode is stubbed until the 당분기 table lands. Flip WF_QUARTER_READY when ready.
  const WF_QUARTER_READY = true;   // 마스터에 값_당분기 → 분기 모드 활성화
  const WF_WINDOW = 4;   // 연도: 최신 분기(4Q 아니어도 그대로 사용) + 직전 3개년말(4Q)
  const WF_Q_WINDOW = 5; // 분기: 최신 포함 직전 5개분기 (owner 2026-06-16)
  const WF_COMPS = [
    { num: 2, ko: "신계약",    full: "신계약 CSM" },
    { num: 3, ko: "이자",      full: "이자 부리" },
    { num: 4, ko: "가정·경험", full: "가정 및 경험 조정" },
    { num: 5, ko: "상각",      full: "CSM 상각" },
  ];

  function wfParseQ(s){ const m=String(s).match(/^(\d{4})\.(\d)Q$/); return m?[+m[1],+m[2]]:[0,0]; }
  function wfCmpDesc(a,b){ const [ay,aq]=wfParseQ(a),[by,bq]=wfParseQ(b); return ay!==by?by-ay:bq-aq; }
  function wfQuartersOf(company){
    const m = ix.wfx.get(company);
    return m ? Array.from(m.keys()).sort(wfCmpDesc) : [];
  }
  function wfVal(company,qtr,num,field){
    const m=ix.wfx.get(company); const qm=m&&m.get(qtr); const rec=qm&&qm.get(num);
    const v=rec ? rec[field||"y"] : null;   // y=연누계(기본), q=당분기
    return (typeof v==="number" && Number.isFinite(v)) ? v : null;
  }
  // D5/D6: 분기 공시 여부 — 4Q 외 분기가 하나라도 있으면 분기 공시사. 데이터 기반(이름 하드코딩 금지).
  function wfHasQuarterly(company){
    return wfQuartersOf(company).some(p => { const [,qn]=wfParseQ(p); return qn!==4; });
  }
  // D7: 시계열 축 윈도잉. periodsAsc=해당 회사 분기 오름차순.
  //  분기모드(분기공시사)=직전 5분기 / 그 외(연도모드·분기미제공사)=연말(4Q)+최신 부분분기.
  function selectPeriods(periodsAsc, mode, hasQ, isMobile){
    if(!periodsAsc.length) return [];
    if(mode==="quarter" && hasQ) return periodsAsc.slice(-5);
    const keep = new Set(periodsAsc.filter(p=>{ const [,qn]=wfParseQ(p); return qn===4; }));
    const last = periodsAsc[periodsAsc.length-1];
    if(last){ const [,lq]=wfParseQ(last); if(lq!==4) keep.add(last); }
    return periodsAsc.filter(p=>keep.has(p));
  }
  // 신계약 CSM(2)은 YTD(연누계) → 당기 증분(같은 FY 직전 분기 YTD 차감). 직전 결측 시 span(합산 분기 수).
  function wfNbIncrement(company, period){
    const [y, qn] = wfParseQ(period);
    const cur = wfVal(company, period, 2);
    if (cur == null) return { value:null, span:1 };
    for (let pq = qn-1; pq >= 1; pq--){
      const prev = wfVal(company, y+"."+pq+"Q", 2);
      if (prev != null) return { value: cur - prev, span: qn - pq };
    }
    return { value: cur, span: qn };
  }
  // 드롭다운 이름(옛 파일)과 새 마스터 이름이 다른 5사 대응 (삼성생명 vs 삼성생명보험, 케이비 vs KB 등).
  function wfNorm(s){ return String(s).replace(/\s/g,"").replace(/케이비/g,"KB"); }
  // 이름 → 코드. 코드 없는 옛 viz/NB는 boot에서 1회만 정규화 매칭 → 이후 전 패널 코드로 동작.
  function codeForName(name){
    if (codeToName[name]) return name; // 이미 코드
    const nn = wfNorm(name);
    for (const code in codeToName){ if (codeToName[code]===name) return code; }
    for (const code in codeToName){ const rn=wfNorm(codeToName[code]); if (rn===nn || rn.includes(nn) || nn.includes(rn)) return code; }
    return null;
  }

  // YEAR window: latest period + prior year-ends (4Q), trailing WF_WINDOW buckets, chrono asc.
  function wfYearBuckets(company){
    const qs = wfQuartersOf(company); if(!qs.length) return [];
    const set = new Set(qs);
    const [ly,lq] = wfParseQ(qs[0]);
    const buckets = [{ year: ly, q: qs[0], label: lq===4 ? String(ly) : qs[0] }];
    for(let k=1;k<WF_WINDOW;k++){
      const y=ly-k, yq=`${y}.4Q`;
      if(set.has(yq)) buckets.push({ year:y, q:yq, label:String(y) });
    }
    return buckets.sort((a,b)=>a.year-b.year);
  }

  // QUARTER window: 최근 WF_Q_WINDOW개 분기 (오름차순). 값_당분기로 분기별 이동.
  function wfQuarterBuckets(company){
    const qs = wfQuartersOf(company); if(!qs.length) return [];   // qs = desc
    return qs.slice(0, WF_Q_WINDOW).reverse().map(q => ({ q, label: q }));
  }

  function wfBuildBars(company, buckets, mode){
    const f = mode==="quarter" ? "q" : "y";   // 분기=당분기, 연도=연누계
    const bars=[];
    const first=buckets[0], last=buckets[buckets.length-1];
    bars.push({ kind:"open", period:first.label, q:first.q, value: wfVal(company,first.q,1,f) });
    for(const b of buckets){
      for(const c of WF_COMPS){
        bars.push({ kind:"comp", period:b.label, q:b.q, comp:c, value: wfVal(company,b.q,c.num,f) });
      }
    }
    bars.push({ kind:"close", period:last.label, q:last.q, value: wfVal(company,last.q,6,f) });
    return bars;
  }

  function wfFmtJo(v, dp){ return (v/10000).toLocaleString("ko-KR",{minimumFractionDigits:dp,maximumFractionDigits:dp}); }

  // ===== 회사 키컬러 (KEYCOLOR-V1, owner 확정 2026-06-12) =====
  // 차트 데이터잉크(워터폴 total 막대·라인 주선)와 select 액티브에만 적용. 배경·패널보더는 무채색 유지.
  // 키 미등록사는 현행 기본 블루 fallback. 표시명 기준 매칭(코드→coName).
  const KEY_COLORS = {
    "삼성생명":"#1428A0", "삼성생명보험":"#1428A0", "삼성화재":"#1428A0", "삼성화재해상보험":"#1428A0",
    "한화생명":"#F37321", "한화생명보험":"#F37321", "한화손해보험":"#F37321",
    "신한라이프":"#0046FF", "신한라이프생명보험":"#0046FF", "신한이지손해보험":"#0046FF",
    "KB손해보험":"#FFBC00", "케이비손해보험":"#FFBC00", "KB라이프생명":"#FFBC00", "케이비라이프생명보험":"#FFBC00",
    "NH농협생명":"#00A05E", "엔에이치농협생명":"#00A05E", "NH농협손해보험":"#00A05E", "엔에이치농협손해보험":"#00A05E",
    "미래에셋생명":"#F58220", "미래에셋생명보험":"#F58220",
    "DB손해보험":"#0E8C3A", "디비손해보험":"#0E8C3A", "DB생명":"#0E8C3A", "디비생명보험":"#0E8C3A",
    "현대해상":"#F47920", "현대해상화재보험":"#F47920",
    "교보생명":"#0B5D52", "교보생명보험":"#0B5D52",
    "메리츠화재":"#E60012", "메리츠화재해상보험":"#E60012",
    "롯데손해보험":"#DA291C",
  };
  const DEFAULT_PRIMARY = "#0d6efd";
  function _hexRgb(h){ const m=/^#?([0-9a-f]{6})$/i.exec(h||""); if(!m) return null; const n=parseInt(m[1],16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
  function _relLum(c){ const f=v=>{v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4);}; return 0.2126*f(c.r)+0.7152*f(c.g)+0.0722*f(c.b); }
  function _darken(c, amt){ const d=v=>Math.round(v*(1-amt)); return `rgb(${d(c.r)},${d(c.g)},${d(c.b)})`; }
  function keyColorOf(name){
    const hex = KEY_COLORS[name];
    if(!hex){ return { primary:DEFAULT_PRIMARY, line:DEFAULT_PRIMARY, soft:"rgba(13,110,253,0.10)", fill:"rgba(13,110,253,0.60)", isKey:false }; }
    const c=_hexRgb(hex);
    // 밝은 색(KB 옐로우 등)은 흰 배경에서 선/축이 안 보이므로 라인용으로 어둡게 보정 (WCAG 가독성). 막대 면적엔 원색.
    const line = (c && _relLum(c) > 0.45) ? _darken(c, 0.32) : hex;
    const soft = c ? `rgba(${c.r},${c.g},${c.b},0.12)` : "rgba(13,110,253,0.10)";
    const fill = c ? `rgba(${c.r},${c.g},${c.b},0.60)` : "rgba(13,110,253,0.60)";
    return { primary:hex, line, soft, fill, isKey:true };
  }
  let currentKey = keyColorOf(null); // renderCompany에서 회사별로 설정

  function renderWfWaterfall(host, company, mode){
    const el = q(host, "#chartWf");
    if (!el || typeof echarts === "undefined") return;
    if (charts.wf){ try{ charts.wf.dispose(); }catch(e){} }
    charts.wf = echarts.init(el, 'iq', { renderer: "canvas" });

    let buckets = mode==="quarter" ? wfQuarterBuckets(company) : wfYearBuckets(company);
    if (window.matchMedia("(max-width:640px)").matches) buckets = buckets.slice(-1);  // D9: 모바일 최신 1버킷
    const bars = wfBuildBars(company, buckets, mode);

    const xs=[], placeholder=[], positive=[], negative=[], totals=[], missing=[], levels=[];
    let running=0;
    bars.forEach((bar)=>{
      if(bar.kind==="open") xs.push(bar.period+"\n기초");
      else if(bar.kind==="close") xs.push(bar.period+"\n기말");
      else xs.push((bar.comp.num===2 ? bar.period : "")+"\n"+bar.comp.ko);

      if(bar.kind==="open" || bar.kind==="close"){
        placeholder.push("-"); positive.push("-"); negative.push("-"); missing.push("-");
        const v=bar.value; totals.push(v!=null?v:"-");
        if(v!=null) levels.push(v);
        if(bar.kind==="open" && v!=null) running=v;
        return;
      }
      const v=bar.value;
      if(v==null){
        const hint=Math.max(Math.abs(running)*0.02, 30);
        placeholder.push(running); positive.push("-"); negative.push("-"); totals.push("-"); missing.push(hint);
        levels.push(running);
        return;
      }
      missing.push("-");
      levels.push(running, running+v);
      if(v>=0){ placeholder.push(running); positive.push(v); negative.push("-"); totals.push("-"); running+=v; }
      else    { placeholder.push(running+v); positive.push("-"); negative.push(-v); totals.push("-"); running+=v; }
    });
    // y축 줌: 기초/기말 CSM 잔액이 커서 0부터면 변동 항목이 눌림 → 데이터가 점유하는 밴드로 범위 축소(변동 가시성↑).
    // 작은 CSM 회사는 max(0,…)로 자연스레 0-base 유지. 기초/기말 막대 바닥은 의도적 clip(broken-axis 줌).
    const _lv = levels.filter(x => typeof x === "number" && isFinite(x));
    let wfYMin, wfYMax;
    if (_lv.length){
      const lo = Math.min(..._lv), hi = Math.max(..._lv), span = hi - lo;
      const pad = span > 0 ? span * 0.12 : Math.max(Math.abs(hi) * 0.05, 100);
      wfYMin = Math.max(0, lo - pad);
      wfYMax = hi + pad;
    }

    const isMobile = window.matchMedia("(max-width:640px)").matches;
    let dataZoom;
    if (isMobile && bars.length > 9){
      const start = Math.max(0, bars.length - 9);
      dataZoom = [{ type:"inside", startValue:start, endValue:bars.length-1 },
                  { type:"slider", height:14, bottom:2, startValue:start, endValue:bars.length-1 }];
    }

    charts.wf.setOption({
      backgroundColor:"transparent",
      tooltip:{
        trigger:"axis", axisPointer:{ type:"shadow" },
        formatter(items){
          const i=items[0].dataIndex; const bar=bars[i];
          const head = bar.kind==="comp"
            ? `${bar.comp.full} · ${bar.period}`
            : `${bar.kind==="open"?"기초":"기말"} CSM · ${bar.period}`;
          if(bar.value==null) return `<b>${head}</b><br/>데이터 없음`;
          const jo=bar.value/10000;
          if(bar.kind==="comp"){
            const sign=bar.value>=0?"+":"△";
            return `<b>${head}</b><br/>${sign}${Math.abs(jo).toLocaleString("ko-KR",{maximumFractionDigits:2})}조 (${sign}${Math.abs(bar.value).toLocaleString("ko-KR")}억)`;
          }
          const s0 = bar.value < 0 ? "△" : "";
          return `<b>${head}</b><br/>${s0}${Math.abs(jo).toLocaleString("ko-KR",{maximumFractionDigits:2})}조 (${s0}${Math.abs(bar.value).toLocaleString("ko-KR")}억)`;
        },
      },
      grid: dataZoom ? { left:52, right:18, top:24, bottom:40 } : { left:52, right:18, top:24, bottom:54 },
      xAxis:{
        type:"category", data:xs,
        axisLabel:{ color:"#495057", fontSize:isMobile?8:10, lineHeight:12, interval:0 },
        axisLine:{ lineStyle:{ color:"#dee2e6" } },
        axisTick:{ show:false },
      },
      yAxis:{
        type:"value", name:"조원",
        min: wfYMin, max: wfYMax,
        nameTextStyle:{ color:"#6c757d", fontSize:11 },
        axisLabel:{ color:"#6c757d", formatter:v=> (v<0?"△":"")+Math.abs(v/10000).toLocaleString("ko-KR",{maximumFractionDigits:1}) },
        splitLine:{ lineStyle:{ color:"#e9ecef" } },
      },
      dataZoom,
      series:[
        { name:"placeholder", type:"bar", stack:"wf", itemStyle:{ color:"transparent" }, emphasis:{ disabled:true }, data:placeholder },
        { name:"missing", type:"bar", stack:"wf", itemStyle:{ color:"rgba(173,181,189,0.55)" }, data:missing },
        { name:"+", type:"bar", stack:"wf", itemStyle:{ color:"#22c55e" }, data:positive,

    }
    // 자동차·일반은 묶지 않고 각각 optional — 코리안리는 자동차가 미해당이라 묶으면 "자동차+일반"
    // 이라는 틀린 라벨로 일반손익만 그리게 된다.
    defs.push({ ko:"자동차", role:"flow", optional:true, get:g=> g(PL_NUM.자동차) });
    defs.push({ ko:"일반",   role:"flow", optional:true, get:g=> g(PL_NUM.일반) });
    defs.push(PL_HEAD_ETC);
    return defs;
  }
  function plStepDefsFor(name, per){
    const head = plLobHead(name, per);
    return head ? head.concat(PL_TAIL) : PL_STEP_DEFS;
  }
  function plMakeGetter(name, per){ return num => plVal(name, per.q, num, per.field); }

  // OCI 세부 항목번호 — 잔차 계산과 모드 판정이 같은 목록을 쓴다(둘이 어긋나면 브리지가 끊긴다).
  const PL_OCI_PARTS = [PL_NUM.FVOCI채무, PL_NUM.보험금융OCI, PL_NUM.위험회피, PL_NUM.FVOCI지분, PL_NUM.재보험금융OCI, PL_NUM.기타OCI];

  // 25(기타포괄손익 총액) − 세부 합. 항목32가 들어오기 전에는 이 잔차가 102개 회사-분기에서
  // 실제로 그려졌다(에이비엘생명 154,075백만=총액의 58%·코리안리 75,903백만=63% 등) — 그 몫이
  // 전부 32에 태깅되면서 YTD 기준 대조가능 273셀에서 잔차가 0이 됐다(실측 2026-08-29).
  // 그래도 막대를 없애지 않는다: 남는 잔차는 이제 진짜 원천 불일치라서 의미가 더 분명하다
  // (당분기 모드에 4건 잔존 — 교보생명 2025.2Q·3Q, KB라이프 2024.4Q, 푸본현대 2023.4Q).
  // 유의미할 때만(총액의 1% 이상, 최소 1억) 노출 → 반올림 오차 수준은 막대를 안 만든다.
  function plOciResidual(g){
    const tot = g(PL_NUM.기타포괄총액);
    if (tot == null) return null;
    const parts = PL_OCI_PARTS.map(g);
    if (!parts.some(v => v != null)) return null;   // 세부 전무 = ociAgg 모드 소관
    const sum = parts.reduce((a,v)=> a + (v||0), 0);
    const resid = tot - sum;
    return (Math.abs(resid) >= Math.max(100, Math.abs(tot)*0.01)) ? resid : null;
  }
  // OCI 구간 표시 모드. full=세부 하나라도 있음 / total=총액만 / none=총포괄손익 미공시(12개사 + 2023.1~2Q).
  function plOciMode(g){
    if (PL_OCI_PARTS.some(n=> g(n)!=null)) return "full";
    if (g(PL_NUM.기타포괄총액)!=null || g(PL_NUM.총포괄손익)!=null) return "total";
    return "none";
  }

  // Build ordered waterfall steps for one period (손보/생보 공통). Drops optional rows that are null/0.
  // opts.noOci=true 면 OCI 구간을 통째로 빼고 당기순이익을 종착 막대로 만든다.
  // (모바일 차트 전용 — 표는 옵션 없이 불러 전 구간을 유지한다.)
  function plBuildSteps(name, per, opts){
    const g = plMakeGetter(name, per);
    const mode = (opts && opts.noOci) ? "none" : plOciMode(g);
    const steps = [];
    for (const d of plStepDefsFor(name, per)){
      if (d.oci){
        if (mode === "none") continue;                                  // OCI 구간 통째 생략
        if (mode === "total" && !(d.ociAgg || d.role === "end")) continue; // 총액 1막대 + 마감만
        if (mode === "full" && d.ociAgg) continue;                      // 세부가 있으면 총액 막대는 중복
      }
      // OCI가 없으면 당기순이익이 그대로 종착 막대(0 기준) — 기존 동작 그대로 유지.
      if (d.ko === "당기순이익"){
        steps.push({ ko:d.ko, role:(mode==="none" ? "end" : "anchor"), value:d.get(g) });
        continue;
      }
      const v = d.get(g);
      if (d.optional && (v==null || v===0)) continue;
      if (d.residual && v==null) continue;
      steps.push({ ko:d.ko, role:d.role, value:v, clip:!!d.clip, wrap:d.wrap });
    }
    return steps;
  }
  function plOciModeOf(name, per){ return plOciMode(plMakeGetter(name, per)); }

  // x-axis label wrapping (full name kept in tooltip + table).
  const PL_WRAP = {
    "원수 CSM상각":"원수\nCSM상각", "원수 위험조정":"원수\n위험조정", "원수 예실차":"원수\n예실차",
    "기타 원수손익":"기타\n원수", "생명장기재보험":"생명장기\n재보험", "자동차+일반":"자동차\n+일반",
    "기타(사업비용)":"기타\n사업비", "보험손익":"보험손익", "투자손익":"투자손익",
    "영업외손익":"영업외", "법인세":"법인세", "당기순이익":"당기\n순이익",
    "기타포괄손익(세부 미공시)":"기타포괄\n(세부미공시)", "FVOCI 채무증권":"FVOCI\n채무증권",
    "보험계약금융손익(OCI)":"보험계약\n금융(OCI)", "위험회피 파생상품":"위험회피\n파생",
    "재보험금융손익(OCI)":"재보험\n금융(OCI)", "기타 포괄손익":"기타\n포괄손익", "미분류 잔차":"미분류\n잔차",
    "FVOCI 지분증권":"FVOCI\n지분증권", "총포괄손익":"총포괄\n손익",
  };
  // 툴팁 보조 한 줄. 항목32는 "미분류"가 아니라 내용이 규명된 묶음이라 무엇이 들어 있는지 밝힌다
  // (24사·14종 계정 실측 — data/_derived/pl_oci_item32_provenance.json, 읽기 전용 참고).
  const PL_TIP_NOTE = {
    "기타 포괄손익": "확정급여 재측정 · 신용손실충당금 · 자산재평가 · 해외사업환산 · 지분법 OCI 등",
    "미분류 잔차": "기타포괄손익 총액(25) − 세부 합. 남아 있으면 원천 공시 자체의 불일치",
  };

  // 모바일 x축 전용 라벨(한 줄 · 45도 회전). 좁은 화면에서는 막대 하나에 20px 남짓이라 두 줄
  // 라벨이 서로 겹쳤다(owner 2026-08-30). 회전만으로는 긴 이름이 아래로 40px 넘게 내려와 그림이
  // 눌리므로 이름도 같이 줄인다. "원수" 접두는 패널 제목·캡션에 이미 있고, 전체 이름은 툴팁과
  // 아래 표에 그대로 남는다. 재보험사 축(생명 수재 …)은 이 표에 없어 bar.ko가 그대로 쓰인다.
  const PL_WRAP_M = {
    "원수 CSM상각":"CSM상각", "원수 위험조정":"위험조정", "원수 예실차":"예실차",
    "기타 원수손익":"기타원수", "생명장기재보험":"재보험", "기타(사업비용)":"사업비",
    "영업외손익":"영업외",
  };

  function renderPlWaterfall(host, name, per){
    const el = q(host, "#chartPl");
    if (!el || typeof echarts === "undefined") return [];
    if (charts.pl){ try{ charts.pl.dispose(); }catch(e){} }
    charts.pl = echarts.init(el, null, { renderer:"canvas" });

    const isMobile = window.matchMedia("(max-width:640px)").matches;
    // 모바일: OCI 구간을 빼 축을 당기순이익 스케일로 되돌린다(owner 2026-08-30).
    const bars = plBuildSteps(name, per, { noOci: isMobile });
    const plHasOci = isMobile && plBuildSteps(name, per).length > bars.length;

    // 각 막대의 [시작,끝] 값좌표. flow=running에서 step, anchor/end=0 기준.
    // 스택+투명 placeholder 방식은 0선을 넘는 step에서 막대가 0 위로 떠버림(롯데 투자손익: 보험손익 +0.03 → 투자손익이
    // 0 아래로 통과) → custom renderItem으로 [min,max] 사각형을 직접 그려 zero-crossing 정상 처리(부호=아래로).
    const xs=[]; const geo=[]; let running=0;
    bars.forEach(bar=>{
      // LOB 스텝은 라벨이 동적이라 자기 wrap을 들고 온다(PL_WRAP는 고정 라벨용 표).
      xs.push(isMobile ? (PL_WRAP_M[bar.ko] || bar.ko)
                       : (bar.wrap || PL_WRAP[bar.ko] || bar.ko));
      // 결측은 조용히 0으로 칠하지 않는다 — Panel 2의 missing 시리즈와 같은 회색 힌트 막대로 그린다.
      // running은 그대로 둔다(없는 값을 0으로 흘리면 뒤 막대가 전부 거짓 위치가 된다).
      if(bar.value==null){ geo.push({ missing:true, at:running }); return; }
      if(bar.role==="anchor" || bar.role==="end"){
        geo.push({ y0:0, y1:bar.value, color:currentKey.primary, clip:!!bar.clip }); running=bar.value;
      } else {
        const end=running+bar.value;
        geo.push({ y0:running, y1:end, color: bar.value>=0 ? "#22c55e" : "#ef4444", clip:!!bar.clip }); running=end;
      }
    });

    // y축 고정 범위 = clip 대상(FVOCI 지분증권·총포괄손익)을 뺀 running total 범위 + 0선.
    // 자동 스케일로 두면 dataZoom으로 밀 때마다 축이 다시 잡혀 막대 높이가 튀고, 누적 브리지에서
    // 축이 움직이면 "이어진 다리"라는 의미 자체가 깨진다(Panel 2 wfYMin/wfYMax와 같은 이유).
    const _lv=[0];
    geo.forEach(gg=>{
      if(!gg) return;
      if(gg.missing){ if(Number.isFinite(gg.at)) _lv.push(gg.at); return; }
      if(gg.clip) return;
      _lv.push(gg.y0, gg.y1);
    });
    const _lo=Math.min(..._lv), _hi=Math.max(..._lv), _span=Math.max(_hi-_lo, 0);
    // 1/2/2.5/5 눈금으로 스냅한다. 스냅 없이 원값+여백을 min/max로 넣으면 ECharts가 경계 눈금을
    // 하나 더 붙여("6.8" 바로 밑에 "6") 라벨이 붙어버린다. 스냅 자체가 여백 역할도 한다.
    const _base = _span>0 ? _span : Math.max(Math.abs(_hi)*0.2, 1000);
    const _rough=_base/5, _mag=Math.pow(10, Math.floor(Math.log10(Math.max(1,_rough)))), _n=_rough/_mag;
    const plYStep=(_n<=1?1:_n<=2?2:_n<=2.5?2.5:_n<=5?5:10)*_mag;
    // y축 눈금 라벨의 소수 자릿수를 **눈금 간격에서 역산**한다. 종전엔 maximumFractionDigits:1
    // 고정이라 간격이 0.05조·0.25조로 잡히는 회사에서 이웃 눈금이 같은 라벨로 찍혔다
    // (예: 0.05·0.10 이 둘 다 "0.1"). 전수 213건 중 197건이 코리안리 밖이었다.
    const plYDec=(x=>{ for(let d=0; d<=3; d++){ const m=x*Math.pow(10,d);
      if(Math.abs(m-Math.round(m))<1e-9) return d; } return 3; })(plYStep/1e6);
    const plYMin=Math.floor((_lo-_base*0.06)/plYStep)*plYStep;
    const plYMax=Math.ceil((_hi+_base*0.06)/plYStep)*plYStep;

    // 초기 표시 창: 실제 차트 폭(el.clientWidth)을 막대당 약 56px로 나눠 잡는다. 미디어쿼리 폭은
    // 사이드바·줌 때문에 차트 폭과 다르다. x축 라벨이 두 줄이라 56px 정도가 필요하다.
    // 오른쪽 끝은 최소한 당기순이익까지 무조건 포함(PL 브리지가 첫 화면에서 끊기면 안 된다).
    // 리사이즈는 renderPlWaterfall을 다시 부르지 않고 charts.pl.resize()만 하므로(하단 resize 리스너)
    // 이 계산은 렌더당 1회 = 사용자가 밀어둔 위치가 리사이즈로 리셋되지 않는다.
    const GRID_L=isMobile?38:56, GRID_R=isMobile?8:18, STEP_PX=56;
    const _usable = Math.max(120, (el.clientWidth||0) - GRID_L - GRID_R);
    const _fit = Math.max(3, Math.floor(_usable / STEP_PX));
    const _netIdx = bars.findIndex(b=> b.ko==="당기순이익");
    const _minEnd = _netIdx>=0 ? _netIdx : (bars.length-1);
    const _endIdx = Math.min(bars.length-1, Math.max(_minEnd, _fit-1));
    // 슬라이더는 데스크톱에도 노출한다 — inside만으로는 오른쪽에 뭐가 더 있는지 알 방법이 없다.
    const dataZoom = (_endIdx < bars.length-1)
      ? [{ type:"inside", startValue:0, endValue:_endIdx },
         { type:"slider", height:14, bottom:2, startValue:0, endValue:_endIdx, brushSelect:false }]
      : undefined;

    charts.pl.setOption({
      backgroundColor:"transparent",
      tooltip:{
        trigger:"axis", axisPointer:{ type:"shadow" },
        formatter(items){
          const i=items[0].dataIndex; const bar=bars[i]; if(!bar) return "";
          if(bar.value==null) return `<b>${bar.ko}</b><br/>데이터 없음`;
          const jo=bar.value/1e6, eok=bar.value/100;
          const sign = bar.value<0 ? "△" : (bar.role==="flow" ? "+" : "");
          const note = PL_TIP_NOTE[bar.ko] ? `<br/><span style="color:#868e96;font-size:11px">${PL_TIP_NOTE[bar.ko]}</span>` : "";
          return `<b>${bar.ko}</b><br/>${sign}${Math.abs(jo).toLocaleString("ko-KR",{maximumFractionDigits:2})}조 (${sign}${Math.abs(eok).toLocaleString("ko-KR",{maximumFractionDigits:0})}억)${note}`;
        },
      },
      // x 라벨이 두 줄이라 슬라이더를 켜면 bottom을 더 줘야 한다(38이면 라벨 위에 슬라이더가 겹친다).
      grid:{ left:GRID_L, right:GRID_R, top:24,
             bottom: dataZoom ? (isMobile?72:58) : (isMobile?60:46) },
      xAxis:{
        type:"category", data:xs,
        axisLabel:{ color:"#495057", fontSize:isMobile?9:10, lineHeight:12, interval:0,
                    rotate:isMobile?45:0, margin:isMobile?6:8 },
        axisLine:{ lineStyle:{ color:"#dee2e6" } },
        axisTick:{ show:false },
      },
      yAxis:{
        type:"value", name:"조원",
        min: plYMin, max: plYMax, interval: plYStep,
        nameTextStyle:{ color:"#6c757d", fontSize:11 },
        axisLabel:{ color:"#6c757d", fontSize:isMobile?9:12, formatter:v=> (v<0?"△":"")+Math.abs(v/1e6).toLocaleString("ko-KR",{minimumFractionDigits:plYDec,maximumFractionDigits:plYDec}) },
        splitLine:{ lineStyle:{ color:"#e9ecef" } },
      },
      dataZoom,
      series:[{
        type:"custom",
        encode:{ y:[0,1] },
        renderItem:(params, api)=>{
          const idx=params.dataIndex; const g=geo[idx]; const bar=bars[idx];
          if(!g || !bar) return;
          const cs=params.coordSys || {};
          const top=(cs.y!=null)?cs.y:0, bot=(cs.y!=null)?(cs.y+cs.height):1e6;
          const xPix=api.coord([idx,0])[0];
          const bw=Math.max(6, api.size([1,0])[0]*0.55);
          // 결측 = 회색 힌트 막대(높이는 값이 아니라 픽셀 고정 — 없는 값에 크기를 부여하지 않는다).
          if(g.missing){
            const yc=api.coord([idx, Number.isFinite(g.at)?g.at:0])[1];
            const yy=Math.max(top, Math.min(bot-8, yc-4));
            const kids=[{ type:"rect", shape:{ x:xPix-bw/2, y:yy, width:bw, height:8 },
                          style:{ fill:"rgba(173,181,189,0.55)" } }];
            if(!isMobile) kids.push({ type:"text", style:{ text:"미공시", x:xPix, y:yy-4, textAlign:"center", textVerticalAlign:"bottom", fill:"#868e96", fontSize:9 } });
            return { type:"group", children:kids };
          }
          const yHiRaw=api.coord([idx, Math.max(g.y0,g.y1)])[1];
          const yLoRaw=api.coord([idx, Math.min(g.y0,g.y1)])[1];
          const cutTop = yHiRaw < top-0.5, cutBot = yLoRaw > bot+0.5;
          const yHi=Math.max(yHiRaw, top), yLo=Math.min(yLoRaw, bot);
          const children=[{
            type:"rect",
            shape:{ x:xPix-bw/2, y:yHi, width:bw, height:Math.max(1, yLo-yHi) },
            style:{ fill:g.color },
          }];
          // 축 눈금은 선형 그대로 두고, 넘치는 막대만 캔버스 끝에서 자른다(axis break 아님).
          // 잘린 자리는 톱니로 마감 + 값 라벨을 안쪽에 붙여 "여기서 잘렸다"를 읽히게 한다.
          const zig=(y, dir)=>{
            const x0=xPix-bw/2, x1=xPix+bw/2, n=Math.max(4, Math.round(bw/5)), amp=3, pts=[];
            for(let i=0;i<=n;i++) pts.push([x0+(x1-x0)*i/n, y + dir*(i%2?amp:-amp)]);
            return { type:"polyline", shape:{ points:pts }, style:{ stroke:"#fff", lineWidth:2.5, fill:null } };
          };
          const isTot = bar.role!=="flow";
          const txt = (bar.value<0?"△":(bar.role==="flow"?"+":""))+plFmtJo(Math.abs(bar.value),2)+(isTot?"조":"");
          if(cutTop || cutBot){
            children.push(zig(cutTop?top+2:bot-2, cutTop?1:-1));
            // 잘린 막대는 축 눈금으로 크기를 읽을 수 없으므로 단위(조)를 라벨에 반드시 붙인다.
            const lab=(isTot?txt:txt+"조")+(cutTop?" ↑":" ↓");
            const lw=Math.max(40, lab.length*8), ly=cutTop?(top+16):(bot-16);
            children.push({ type:"rect", shape:{ x:xPix-lw/2, y:ly-8, width:lw, height:16, r:3 },
              style:{ fill:"rgba(255,255,255,0.88)" } });
            children.push({ type:"text", style:{ text:lab, x:xPix, y:ly,
              textAlign:"center", textVerticalAlign:"middle",
              fill:"#212529", fontSize:10, fontWeight:"bold" } });
          } else if(!isMobile){
            children.push({ type:"text", style:{ text:txt, x:xPix, y:yHi-4, textAlign:"center", textVerticalAlign:"bottom", fill:"#212529", fontSize:isTot?10:9, fontWeight:isTot?"bold":"normal" } });
          }
          return { type:"group", children };
        },
        data: geo.map(g=> (g && !g.missing) ? [g.y0, g.y1] : [0,0]),
        z:2,
      }],
    }, true);
    return bars;
  }

  // ---- shared table builder (matches Panel 5 style) ----
  function buildMiniTable(headers, rows){
    const tbl=document.createElement("table");
    const thead=document.createElement("thead"); const htr=document.createElement("tr");
    headers.forEach((h,i)=>{ const th=document.createElement("th"); th.textContent=h; if(i>0) th.className="num"; htr.appendChild(th); });
    thead.appendChild(htr); tbl.appendChild(thead);
    const tbody=document.createElement("tbody");
    for(const r of rows){
      const tr=document.createElement("tr");
      if(r.cls) tr.className=r.cls;
      if(r.hide) tr.style.display="none";
      r.cells.forEach((c,i)=>{
        const td=document.createElement("td");
        if(c instanceof Node) td.appendChild(c); else td.textContent=c;
        if(i>0) td.className="num";
        if(r.bold) td.style.fontWeight="700";
        if(r.muted) td.style.color="#6c757d";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    }
    tbl.appendChild(tbody);
    return tbl;
  }
  // 한국 회계 표기: 정수 반올림 + 천단위 콤마 + 음수는 △(세모).
  function samo(n){
    if(n==null || !Number.isFinite(n)) return "—";
    // `|| 0`은 -0 정규화. Math.round(-0.4)는 -0이고 `-0 < 0`이 false라 △ 분기를 안 타서
    // toLocaleString이 "-0"을 뱉는다(△ 표기 규칙 위반). 코리안리 장기 출재 위험조정 2026.2Q에서
    // 실제로 노출돼 발견.
    const r = Math.round(n) || 0;
    return r<0 ? "△"+Math.abs(r).toLocaleString("ko-KR") : r.toLocaleString("ko-KR");
  }
  function fmtEok(vMn){ return vMn==null ? "—" : samo(vMn/100); }

  // shock 표기 통일(inbox 3b): "3.27% 증가/상승"→"3.27%↑", "9.16% 감소/하락"·"(-)9.16%"→"9.16%↓".
  // 복합·비정형(가정변경효과·괄호병기·금액덩어리 등)은 부분치환 후 원문 보존(파싱 실패해도 안전).
  function fmtShock(raw){
    if (raw == null) return "-";
    let s = String(raw).trim();
    if (!s || s === "-") return s || "-";
    s = s.replace(/\(-\)\s*(\d[\d,]*(?:\.\d+)?)\s*%(p?)/g, "$1%$2↓");      // (-)9.16% → 9.16%↓
    s = s.replace(/(\d[\d,]*(?:\.\d+)?)\s*%(p?)\s*(증가|상승)/g, "$1%$2↑"); // 3.27% 증가 → 3.27%↑
    s = s.replace(/(\d[\d,]*(?:\.\d+)?)\s*%(p?)\s*(감소|하락)/g, "$1%$2↓"); // 9.16% 감소 → 9.16%↓
    s = s.replace(/(\d[\d,]*(?:\.\d+)?)\s*%(p?)\s*[\^▲]/g, "$1%$2↑");      // 3.27%^ / 3.27%▲ → 3.27%↑
    s = s.replace(/(\d[\d,]*(?:\.\d+)?)\s*%(p?)\s*▼/g, "$1%$2↓");          // 3.27%▼ → 3.27%↓
    // 삼성생명류: 부호·방향어 없는 선두 "3.27%"는 상향 충격 → ↑ (하향은 위 (-)룰로 처리). 이미 ↑/↓면 보존.
    s = s.replace(/^(\s*)(\d[\d,]*(?:\.\d+)?)\s*%(p?)(?!\s*[↑↓])/, "$1$2%$3↑");
    return s.replace(/\s{2,}/g, " ").trim();
  }

  // D1: 민감도 표 기준시점(as-of). 데이터에 period/as_of가 비어 rcept_no(접수번호 앞 8자리=제출일)에서 파생.
  // DART 정기보고서 제출월 → 보고 기준일: 1~4월=직전 사업연도(12-31), 5~6=1Q(03-31), 7~9=반기(06-30), 그 외=3Q(09-30).
  function asOfFromRcept(rcept){
    const s = String(rcept||"").replace(/\D/g, "");
    if (s.length < 8) return null;
    const y = +s.slice(0,4), m = +s.slice(4,6);
    if (m <= 4) return { label:"FY"+(y-1)+" 사업보고서", date:(y-1)+"-12-31" };
    if (m <= 6) return { label:"FY"+y+" 1분기보고서", date:y+"-03-31" };
    if (m <= 9) return { label:"FY"+y+" 반기보고서",   date:y+"-06-30" };
    return            { label:"FY"+y+" 3분기보고서", date:y+"-09-30" };
  }
  function senAsOf(sPick){
    if(!sPick) return null;
    if(sPick.as_of) return { label:(sPick.period_label||sPick.period||"공시"), date:String(sPick.as_of) };
    return asOfFromRcept(sPick.rcept_no);
  }

  // Trailing periods for the PL table: year → latest 3 FY(4Q); quarter → latest 4 quarters (chrono asc).
  function plTablePeriods(name, mode){
    const qs = plQuartersOf(name); // desc
    if(!qs.length) return [];
    // CSM시계열·CSM waterfall과 동일 윈도잉(selectPeriods): 분기=최신 포함 직전5분기 / 연도=연말(4Q)+최신부분.
    const asc = qs.slice().reverse();
    const hasQ = asc.some(p=>{ const [,qn]=wfParseQ(p); return qn!==4; });
    const sel = selectPeriods(asc, mode, hasQ, false);   // 표는 가로 스크롤 → 모바일도 풀 윈도우
    return sel.map(qq=>{
      const is4Q = /\.4Q$/.test(qq);
      return { q:qq,
               field: (mode==="quarter") ? "q" : "y",
               label: (mode==="quarter") ? qq : (is4Q ? String(wfParseQ(qq)[0]) : (qq+"("+fyPartialLabel(wfParseQ(qq)[1])+")")) };
    });
  }

  // 모바일에서 차트가 당기순이익에서 끊겼다는 사실을 표 위에 명시한다(조용히 감추지 않는다).
  function plMobileNote(host, show){
    let el = q(host, "#plMobileNote");
    if(!el){
      const tbl = q(host, "#plTable"); if(!tbl) return;
      el = document.createElement("div");
      el.id = "plMobileNote";
      el.style.cssText = "font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.5";
      tbl.parentNode.insertBefore(el, tbl);
    }
    el.textContent = show
      ? "좁은 화면에서는 그래프를 당기순이익까지만 그립니다 — 기타포괄손익 항목은 당기순이익보다 자릿수가 커서 함께 그리면 순이익까지의 흐름이 눌립니다. 총포괄손익까지의 전 구간은 아래 표에 그대로 있습니다."
      : "";

  // 표 전용: 당기순이익 뒤의 OCI 세부를 '기타포괄손익' 한 줄 + (＋) 토글로 접는다
  // (owner 2026-08-30). 차트는 이 함수를 타지 않는다 — 워터폴은 스텝을 다 그려야 다리가 이어진다.
  //
  // 총포괄손익(role=end)은 합계 행이라 그룹에 넣지 않고 그대로 남긴다.
  // 그룹 합계는 회사가 공시한 **항목25(기타포괄손익 총액)** 를 쓴다(24+25=31 이 전 36사 전 분기
  // 오차 0). 25가 없는 분기에서만 세부 합으로 대체하고 그 사실을 title 로 밝힌다.
  function plOciGroupDefs(defs){
    const parts = defs.filter(d=> d.oci && d.role !== "end" && !d.ociAgg);
    if (parts.length <= 1) return defs;          // 접을 게 없으면 그대로
    const out = [];
    let placed = false;
    for (const d of defs){
      if (d.oci && d.role !== "end"){
        if (d.ociAgg) continue;                  // 총액 1막대 전용 def — 그룹 행이 그 자리를 대신한다
        if (placed) continue;
        out.push({
          ko: "기타포괄손익", role: "flow", ociGroup: true,
          subTitle: "기타포괄손익 세부",
          sub: parts.map(p=> ({ ko: p.ko, num: p.num, get: p.get })),
          get: g => {
            const tot = g(PL_NUM.기타포괄총액);
            if (tot != null) return tot;
            let s = null;
            for (const p of parts){ const v = p.get(g); if (v != null) s = (s || 0) + v; }
            return s;
          },
        });
        placed = true;
        continue;
      }
      out.push(d);
    }
    return out;
  }

  function renderPlTable(host, name, mode){
    const box=q(host,"#plTable"); if(!box) return; box.innerHTML="";
    const periods = plTablePeriods(name, mode);
    if(!periods.length) return;
    const getters = periods.map(p=> plMakeGetter(name,p));
    const latest = periods[periods.length-1];
    const present = new Set(plBuildSteps(name, latest).map(s=>s.ko));
    const defs = plOciGroupDefs(plStepDefsFor(name, latest).filter(d=> present.has(d.ko)));
    const gLast = getters[getters.length-1];

    const headers = ["항목", ...periods.map(p=>p.label)];
    const rows = [];
    // sub를 가진 스텝은 전부 ＋ 토글이 붙는다. 기본형은 생명장기재보험 하나, LOB형은 다리 수만큼
    // (코리안리 = 생명 수재/출재 · 장기 수재/출재 넷) — 세부가 최신 기간에 하나도 없으면 안 만든다.
    const togGroups = [];
    for(const d of defs){
      // 세부 존재 판정도 num/get 양쪽을 본다 — OCI 그룹의 '미분류 잔차'는 num 이 없다.
      if(d.sub && d.sub.some(s=> ((s.get || (g=> g(s.num)))(gLast))!=null)){
        const cls = "pl-resub-"+togGroups.length;
        const lab=document.createElement("span");
        const tog=document.createElement("button");  // G1: K-ICS .subtoggle 양식 미러(common.css)
        tog.type="button"; tog.className="subtoggle";
        tog.textContent="+"; tog.title=(d.subTitle||d.ko)+" 펼치기"; tog.setAttribute("aria-expanded","false");
        lab.appendChild(document.createTextNode(d.ko)); lab.appendChild(tog);
        rows.push({ cells:[ lab, ...getters.map(g=> fmtEok(d.get(g))) ] });
        for(const s of d.sub){
          // 세부 행의 값: 보통은 항목번호(num) 하나지만, 미분류 잔차처럼 계산식인 것도 있다.
          const sGet = s.get || (g=> g(s.num));
          rows.push({ cls:"pl-resub "+cls, hide:true, muted:true, cells:[ "　└ "+s.ko, ...getters.map(g=> fmtEok(sGet(g))) ] });
        }
        togGroups.push({ tog, cls, label:d.ko, title:(d.subTitle||d.ko) });
      } else {
        rows.push({ cells:[ d.ko, ...getters.map(g=> fmtEok(d.get(g))) ], bold:(d.role==="anchor"||d.role==="end") });
      }
    }
    const tbl = buildMiniTable(headers, rows);
    box.appendChild(tbl);
    for(const grp of togGroups){
      const subTrs = Array.from(tbl.querySelectorAll("tr."+grp.cls));
      grp.tog.addEventListener("click", ()=>{
        const showing = subTrs.length && subTrs[0].style.display!=="none";
        subTrs.forEach(tr=> tr.style.display = showing ? "none" : "");
        grp.tog.textContent = showing ? "+" : "−";
        grp.tog.title = grp.title + (showing ? " 펼치기" : " 접기");
        grp.tog.setAttribute("aria-expanded", showing ? "false" : "true");
      });
    }
    // 토글이 실제로 붙은 행만 안내한다(전엔 토글이 없는 4개사에서도 "생명장기재보험 ＋" 을 안내했다).
    const subHint = togGroups.length
      ? " · " + (togGroups.length>1 ? "LOB 각 행" : togGroups[0].label) + " ＋ 클릭 시 세부"
      : "";
    const note=document.createElement("div"); note.className="small-muted"; note.style.marginTop="6px";
    note.textContent = "단위 억원(소수 반올림) · " + (mode==="quarter" ? "직전 4분기(당분기)" : "직전 3개년(연 누계)")
      + " · 음수 △" + subHint + " · 당기순이익 이후 행은 기타포괄손익(OCI) 구간 · —는 해당 항목 미공시";
    box.appendChild(note);
  }

  function renderWfTable(host, company, buckets, mode){
    const box=q(host,"#wfTable"); if(!box) return; box.innerHTML="";
    if(!buckets || !buckets.length) return;

  function heatCss(v, absMax){
    const mx = Math.max(Math.abs(absMax||1), 1e-9)
    const t = Math.max(-1, Math.min(1, Number(v)/mx))
    if (t<=0){
      const u=-t;
      return "rgba(239,68,68,"+(0.10+0.55*u)+")"
    }
    const u=t;
    return "rgba(34,197,94,"+(0.11+0.58*u)+")"
  }

  // A11y 2026-07-21: 색맹-안전 팔레트로 교체 (기존 팔레트는 orange/red, purple/teal 쌍이
  // 적록색맹 시뮬레이션 하에서 ΔRGB 39-52로 헷갈림 — docs/a11y_baseline.md #11).
  // scripts/a11y_contrast_check.py로 검증: 신규 팔레트 전 쌍 최소 ΔRGB 82(기존 최저 39의 2배+).
  const NB_LINE_COLORS = ["#0d6efd", "#009E73", "#D55E00", "#343a40", "#CC79A7", "#7c5c00"];

  function stub(el, show, msg){

  function countUp(el, target, fmt, dur){
    if(!el||!Number.isFinite(target)){if(el)el.textContent=fmt?fmt(target):'—';return;}
    if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=fmt(target);return;}
    const d=dur||500, t0=performance.now();
    (function step(t){const p=Math.min((t-t0)/d,1),e=1-Math.pow(1-p,3);el.textContent=fmt(target*e);if(p<1)requestAnimationFrame(step);})(t0);
  }

  // 억원 → "X조 Y,YYY억원" (1조 미만은 "Y,YYY억원"). 억 정수 반올림, 음수 △.
  function fmtEokKR(eok){
    if(eok==null || !Number.isFinite(eok)) return '—';
    const neg = eok < 0;
    const v = Math.round(Math.abs(eok));
    const jo = Math.floor(v/10000), rem = v%10000;
    const s = jo>0 ? (jo.toLocaleString()+'조'+(rem>0 ? (' '+rem.toLocaleString()+'억원') : '')) : (v.toLocaleString()+'억원');
    return (neg?'△':'')+s;
  }
  function renderKpi7(host, company, latestQ) {

    const closing = wfVal(company, latestQ, 6, 'y');
    const amort   = wfVal(company, latestQ, 5, 'y');
    const nbCSM   = wfVal(company, latestQ, 2, 'y');
    const nbPts   = (ix.nbm.get(company)||[]).filter(r=>r["신계약CSM배수_연누계"]!=null);
    const nbMult  = nbPts.length ? nbPts[nbPts.length-1]["신계약CSM배수_연누계"] : null;
    cu('kpi7Closing', closing,                          fmtEokKR);
    cu('kpi7Amort',   amort!=null?Math.abs(amort):null, fmtEokKR);
    cu('kpi7NbCsm',   nbCSM,                            fmtEokKR);
    cu('kpi7NbMult',  nbMult!=null?Number(nbMult):null, v=>fmtNum(v,2)+'×');
  }

    // ===== Panel 1 (was 7): 재무상태표 T자 (IFRS17_BS.json) =====
    // owner 20260814T1250Z(bs_taccount_top_panel): 최상단 이동 + T자(좌 자산/우상단 부채/우하단 자본)
    // + 섹션당 2단계 드릴다운(총계→세부). 렌더 로직은 항목번호를 하드코딩하지 않고 섹션·레벨로만
    // 그룹핑 — 파서가 실컬럼(섹션/레벨)을 얹으면 HTML 무수정으로 세부가 채워진다.
    // 지금은 그 컬럼이 없으므로 아래 브릿지로 현재 항목 1-7만 임시 매핑(실컬럼이 오면 그 값이 우선).
    const EQ_SECTION_LEVEL_BRIDGE = {
      1: ["자산", 1], 2: ["부채", 1], 3: ["자본", 1],
      4: ["자본", 2], 5: ["준비금", 2], 6: ["준비금", 2], 7: ["준비금", 2],
    };
    function eqQuartersOf(company){
      const m = ix.eqx.get(company);
      return m ? Array.from(m.keys()).sort(wfCmpDesc) : [];
    }
    function eqRows(company, qtr){
      const m = ix.eqx.get(company); const arr = m && m.get(qtr);
      return arr || [];
    }
    function eqTotal(company, qtr, section){
      const row = eqRows(company,qtr).find(r=> r.section===section && r.level===1);
      return row ? row.value : null;
    }
    function eqDetailRows(company, qtr, section){
      return eqRows(company,qtr).filter(r=> r.section===section && r.level===2);
    }
    // 자산총계(자산/L1)가 있는 최신 분기를 앵커로 — equity 커버리지가 wf/pl과 다를 수 있어(회사별 BS 공시 유무 차이) 최신 wf분기에 비어 있을 수 있음.
    function eqLatestQuarter(company){
      for (const qtr of eqQuartersOf(company)) if (eqTotal(company,qtr,"자산")!=null) return qtr;
      return null;
    }
    // owner 20260818(원천 테이블): CSM의 wfHasQuarterly와 같은 개념을 BS 자체 커버리지로 — BS는
    // 회사별 공시 유무가 CSM/PL과 다를 수 있어 별도 계산 필요.
    function eqHasQuarterly(company){
      return eqQuartersOf(company).some(p => { const [,qn]=wfParseQ(p); return qn!==4; });
    }
    // 선택된 여러 분기에 걸친 세부 항목명 유니온(항목번호로 정렬) — 분기마다 있다/없다가 갈릴 수
    // 있어 열(분기)을 고정한 뒤 행(항목)을 합집합으로 잡아야 표가 안 흔들린다. 항목번호 하드코딩 없음.
    function eqUnionNames(company, periods, section){
      const seen = new Map();
      for (const qtr of periods){
        for (const r of eqRows(company, qtr)){
          if (r.section===section && r.level===2 && !seen.has(r.name)) seen.set(r.name, r.num);
        }
      }
      return Array.from(seen.entries()).sort((a,b)=>a[1]-b[1]).map(([name])=>name);
    }
    function eqValByName(company, qtr, section, name){
      const row = eqRows(company, qtr).find(r=> r.section===section && r.level===2 && r.name===name);
      return row ? row.value : null;
    }

    // validation 20260814T1710Z: 레벨2는 owner 스코프상 "주요 계정 최대 15줄 하이라이트"라
    // 폐쇄검산 대상이 아님(scripts/build_ifrs17_bs.py 주석) — 세부합이 총계에 못 미치는 게 정상인데
    // 화면에 그 설명이 없으면 "안 맞다·깨졌다"로 오독됨(반복된 혼선 지점). total이 있으면 표시된
    // 세부 합과의 잔차를 "기타·미표시" 회색 행으로 자동 계산해 붙인다(마스터에 잔차 항목 신설 금지
    // — 렌더 단 계산만).
    function renderDetailRows(box, rows, total){
      box.innerHTML = "";
      if (!rows.length) return;
      const maxAbs = Math.max(1, ...rows.map(r=>r.value).filter(v=>v!=null).map(Math.abs));
      rows.slice().sort((a,b)=>a.num-b.num).forEach(r=>{
        const pct = r.value==null ? 0 : Math.max(2, Math.abs(r.value)/maxAbs*100);
        const div = document.createElement("div");
        div.className = "bs-l2-row";
        div.dataset.name = r.name;
        div.innerHTML =
          `<span class="bs-l2-lab">${r.name}</span>`+
          `<span class="bs-l2-bar-track"><span class="bs-l2-bar" style="width:${pct}%"></span></span>`+
          `<span class="bs-l2-val">${r.value==null?'—':fmtEokKR(r.value/100)}</span>`;
        box.appendChild(div);
      });
      if (total!=null){
        const shown = rows.reduce((a,r)=> a + (r.value||0), 0);
        const residual = total - shown;
        const div = document.createElement("div");
        div.className = "bs-l2-row bs-l2-row-residual";
        div.title = "주요 계정 하이라이트라 세부 목록이 전 계정을 망라하지 않음 — 총계에서 위 표시분을 뺀 나머지";
        div.innerHTML =
          `<span class="bs-l2-lab">기타·미표시</span>`+
          `<span class="bs-l2-bar-track"></span>`+
          `<span class="bs-l2-val">${fmtEokKR(residual/100)}</span>`;
        box.appendChild(div);
      }
    }

    // D-4 20260818(owner): 법정준비금(해약환급금·비상위험·대손, 섹션="준비금")을 별도 참고 블록이
    // 아니라 자본 드릴다운 안의 "이익잉여금" 바로 아래 들여쓴 하위 행으로. 합계(위 renderDetailRows의
    // shown/residual)에는 절대 포함하지 않음 — 이익잉여금 내부 적립이라 더하면 이중계상(owner 경고).
    // 항목번호가 아니라 항목명으로 앵커링(섹션/레벨 데이터계약과 동일하게 번호 하드코딩 회피).
    function renderReserveSubrows(box, reserveRows, anchorName){
      if (!reserveRows.length) return;
      let anchor = null;
      for (const row of box.querySelectorAll(".bs-l2-row")){
        if (row.dataset.name === anchorName){ anchor = row; break; }
      }
      const frag = document.createDocumentFragment();
      reserveRows.slice().sort((a,b)=>a.num-b.num).forEach(r=>{
        const div = document.createElement("div");
        div.className = "bs-l2-row bs-l2-row-sub";
        div.title = "법정준비금 — 이익잉여금 내부 적립, 자본총계 합계에는 미포함";
        div.innerHTML =
          `<span class="bs-l2-lab">　└ ${r.name}</span>`+
          `<span class="bs-l2-bar-track"></span>`+
          `<span class="bs-l2-val">${r.value==null?'—':fmtEokKR(r.value/100)}</span>`;
        frag.appendChild(div);
      });
      if (anchor) { anchor.after(frag); return; }
      // 이익잉여금 행 자체가 없는 회사(비상장 등) — 기타·미표시(잔차) 행 앞에 붙여 "잔차가 마지막"
      // 순서를 유지(잔차 뒤에 준비금이 오면 잔차가 총계를 요약한 게 아니라는 인상을 줌).
      const residual = box.querySelector(".bs-l2-row-residual");
      if (residual) box.insertBefore(frag, residual); else box.appendChild(frag);
    }

    // 자산/부채/자본 세 구역 공통 렌더: 총계 표시 + '+' 토글(레벨2 행이 하나도 없으면 owner D-3
    // 지시대로 비활성+aria-disabled+"세부 미공시" — 세부 미착수(스키마 이전)와 회사 비공시(비상장
    // 15사) 두 경우를 구분하지 않고 같은 코드로 처리해도 사용자 입장에서 결과가 같아 정확하다.
    function renderBsZone(company, qtr, section, totalId, toggleId, detailId){
      const total = eqTotal(company, qtr, section);
      const totEl = document.getElementById(totalId);
      if (totEl) totEl.textContent = fmtEokKR(total==null?null:total/100);

      const rows = eqDetailRows(company, qtr, section);
      // D-4: 법정준비금(섹션="준비금")은 합계엔 안 넣지만 자본 구역 세부에 이익잉여금 하위로 얹는다.
      const reserveRows = section==="자본" ? eqRows(company, qtr).filter(r=> r.section==="준비금" && r.level===2) : [];
      const btn = document.getElementById(toggleId);
      const box = document.getElementById(detailId);
      if (btn && box){
        renderDetailRows(box, rows, total);
        if (reserveRows.length) renderReserveSubrows(box, reserveRows, "이익잉여금");
        box.hidden = true; btn.setAttribute("aria-expanded","false"); btn.textContent = "+"; // 회사 변경 시 항상 접힌 상태로 리셋
        if (!rows.length && !reserveRows.length){
          btn.disabled = true; btn.setAttribute("aria-disabled","true"); btn.title = "세부 미공시";
          btn.onclick = null;
        } else {
          btn.disabled = false; btn.removeAttribute("aria-disabled"); btn.title = section+" 세부 펼치기";
          btn.onclick = ()=>{
            const showing = !box.hidden;
            box.hidden = showing;
            btn.setAttribute("aria-expanded", String(!showing));
            btn.textContent = showing ? "+" : "−";
          };
        }
      }
      return total;
    }

    function renderBsSection(host, company){
      const qtr = eqLatestQuarter(company);
      const capEl = q(host, "#bsCap"), stubEl = q(host, "#bsStub"), wrap = q(host, "#bsWrap");
      if (!qtr){
        if (capEl) capEl.textContent = "";
        if (wrap) wrap.style.display = "none";
        stub(stubEl, true, "재무상태표 데이터가 아직 수록되지 않은 보험사입니다.");
        return;
      }
      stub(stubEl, false);
      if (wrap) wrap.style.display = "";
      if (capEl) capEl.textContent = "기준 "+qtr+" · 단위 억원 · 음수 △ · 섹션 옆 + 를 누르면 세부가 펼쳐집니다(주요 계정만 — 전 계정 아님)";

      const liab   = renderBsZone(company, qtr, "부채", "bsTotLiab",   "bsToggleLiab",   "bsDetailLiab");
      const equity = renderBsZone(company, qtr, "자본", "bsTotEquity", "bsToggleEquity", "bsDetailEquity");
      renderBsZone(company, qtr, "자산", "bsTotAsset", "bsToggleAsset", "bsDetailAsset");

      // T자 우측(부채/자본) 높이를 실제 값 비율로 — 항등식(자산=부채+자본)이 그림으로 읽히게(owner 권장).
      // 자본잠식(자본<0) 등 비정상 부호에서는 면적비가 의미 없으므로 50/50 fallback.
      const liabEl = document.getElementById("bsZoneLiab"), equityEl = document.getElementById("bsZoneEquity");
      if (liabEl && equityEl){
        if (liab!=null && equity!=null && liab>=0 && equity>=0 && (liab+equity)>0){
          const liabPct = Math.max(8, Math.min(92, Math.round(liab/(liab+equity)*100)));
          liabEl.style.flexGrow = String(liabPct); equityEl.style.flexGrow = String(100-liabPct);
        } else {
          liabEl.style.flexGrow = "1"; equityEl.style.flexGrow = "1";
        }
      }
    }

    // owner 20260819 재확인 — 연도모드가 "직전 3년"을 어김: selectPeriods()는 존재하는 4Q를 전부
    // 반환하는 함수라, BS 데이터가 2021년까지 있는 회사(메리츠화재·현대해상·KB손보·코리안리 등
    // 실측)는 5-6개 열이 붙었다(2021.4Q~2026.2Q). CSM Panel 2의 wfYearBuckets()와 동일하게
    // 최신 분기 + 직전 3개년말로 강하게 캡. selectPeriods는 다른 패널(PL표·CSM 시계열·NB)에서도
    // 공유돼 있어 그쪽 동작을 바꾸지 않도록 여기선 건드리지 않고 BS 전용 함수를 새로 둔다.
    function eqYearPeriods(periodsAsc){
      if (!periodsAsc.length) return [];
      const set = new Set(periodsAsc);
      const last = periodsAsc[periodsAsc.length-1];
      const [ly] = wfParseQ(last);
      const out = [last];
      for (let k=1; k<4; k++){
        const yq = (ly-k)+".4Q";
        if (set.has(yq)) out.push(yq);
      }
      return out.sort((a,b)=>{ const [ay,aq]=wfParseQ(a), [by,bq]=wfParseQ(b); return ay!==by ? ay-by : aq-bq; });
    }

    // owner 20260818("그 밑에 원천 테이블도 시계열로"): T자 스냅샷 아래 다분기 표. 상단 기준
    // 셀렉터(#wfPeriod)를 그대로 따라간다 — 분기=직전5분기(selectPeriods 재사용), 연도=최신+직전
    // 3개년말(eqYearPeriods, 위), 분기 미제공사는 CSM 패널과 동일한 "연도로 바꿔라" 안내. 행: 자산/
    // 부채/자본 총계(+토글)→세부(+토글)→자본 세부의 "이익잉여금"은 자체 +토글로 법정준비금(섹션=
    // 준비금) 한 겹 더 하위에 — 합계 계산엔 여전히 안 넣는다(D-4 원칙 그대로, 여긴 총계를 eqTotal
    // 에서 직접 읽어 합산 자체를 안 하므로 애초에 이중계상 위험이 없음).
    function renderBsTable(host, company, mode){
      const box = q(host, "#bsTable"), capEl = q(host, "#bsTableCap"), stubEl = q(host, "#bsTableStub");
      if (!box) return;
      box.innerHTML = "";
      const ascAll = eqQuartersOf(company).slice().reverse();
      if (!ascAll.length){ stub(stubEl, false); if (capEl) capEl.textContent = ""; return; } // renderBsSection이 이미 상위 stub 처리
      const hasQ = eqHasQuarterly(company);
      if (mode === "quarter" && !hasQ){
        stub(stubEl, true, "분기 공시 미제공 보험사입니다. 상단 ‘기준’을 ‘연도’로 바꾸면 연 단위 표가 표시됩니다.");
        if (capEl) capEl.textContent = "";
        return;
      }
      stub(stubEl, false);
      const periods = mode === "quarter" ? selectPeriods(ascAll, mode, hasQ, false) : eqYearPeriods(ascAll);
      if (!periods.length) return;

      if (capEl) capEl.textContent = "표시 " + periods[0] + " ~ " + periods[periods.length-1] + " · " + (mode==="quarter"?"분기":"연도") + " 기준 · 단위 억원 · 음수 △";

      const headers = ["구분", ...periods.map(p => { const [y,qn]=wfParseQ(p); return (mode!=="quarter" && qn===4) ? String(y) : p; })];

      const SECTIONS = [["자산","asset"], ["부채","liab"], ["자본","equity"]];
      const rowDefs = [];
      for (const [secKey, secId] of SECTIONS){
        rowDefs.push({
          label: secKey, bold: true, isToggle: true, toggleGroup: "g_"+secId,
          cells: periods.map(qtr => { const v = eqTotal(company, qtr, secKey); return v==null ? "—" : samo(v/100); }),
        });
        const names = eqUnionNames(company, periods, secKey);
        let reAttached = false;
        for (const name of names){
          const isRE = secKey==="자본" && name==="이익잉여금";
          rowDefs.push({
            label: name, level: 1, group: "g_"+secId, hidden: true,
            isToggle: isRE, toggleGroup: isRE ? "g_re_"+secId : null,
            cells: periods.map(qtr => { const v = eqValByName(company, qtr, secKey, name); return v==null ? "—" : samo(v/100); }),
          });
          if (isRE){
            reAttached = true;
            for (const rn of eqUnionNames(company, periods, "준비금")){
              rowDefs.push({
                label: rn, level: 2, group: "g_re_"+secId, hidden: true,
                cells: periods.map(qtr => { const v = eqValByName(company, qtr, "준비금", rn); return v==null ? "—" : samo(v/100); }),
              });
            }
          }
        }
        // 이익잉여금 행 자체가 없는 회사(비상장 등)도 준비금 공시는 있을 수 있음 — 누락 방지로 자본
        // 세부 끝에 평행 배치(T자 D-4의 앵커-없음 폴백과 동일 취지). owner 20260819(inbox
        // 20260819T0620Z, 악사손해보험 실사례): 이 경로엔 소속 라벨이 없어서, 그 섹션에 AOCI 하나만
        // 남아있으면 준비금이 화면상 "AOCI의 하위 항목"처럼 오독됨 — T자(L1090)와 같은 문구의 구분
        // 행을 넣어 AOCI와 시각적으로 분리.
        if (secKey==="자본" && !reAttached){
          const reNames = eqUnionNames(company, periods, "준비금");
          if (reNames.length){
            rowDefs.push({
              note: true, group: "g_"+secId, hidden: true,
              label: "법정준비금 — 이익잉여금 내부 적립, 자본총계 합계에는 미포함",
            });
            for (const rn of reNames){
              rowDefs.push({
                label: rn, level: 1, group: "g_"+secId, hidden: true,
                cells: periods.map(qtr => { const v = eqValByName(company, qtr, "준비금", rn); return v==null ? "—" : samo(v/100); }),
              });
            }
          }
        }
      }
      box.appendChild(buildBsTableDom(headers, rowDefs));
    }

    function buildBsTableDom(headers, rowDefs){
      const tbl = document.createElement("table");
      const thead = document.createElement("thead"); const htr = document.createElement("tr");
      headers.forEach((h,i)=>{ const th=document.createElement("th"); th.textContent=h; if(i>0) th.className="num"; htr.appendChild(th); });
      thead.appendChild(htr); tbl.appendChild(thead);
      const tbody = document.createElement("tbody");

      const groups = {};   // toggleGroup -> [tr,...] (그 그룹에 속한 행들)
      const btns = {};     // toggleGroup -> {btn, label} (그 그룹을 여는 버튼)

      rowDefs.forEach(r=>{
        const tr = document.createElement("tr");
        if (r.hidden) tr.style.display = "none";
        if (r.group) (groups[r.group] || (groups[r.group]=[])).push(tr);

        // 데이터 없는 소속 구분행(예: 이익잉여금 앵커가 없는 회사의 법정준비금 — owner 20260819) —
        // 전체 폭 라벨만, 토글/셀 로직과 무관.
        if (r.note){
          const noteTd = document.createElement("td");
          noteTd.colSpan = headers.length;
          noteTd.className = "small-muted";
          noteTd.style.cssText = "font-style:italic;padding-top:10px;border-top:1px dashed var(--border)";
          noteTd.textContent = "　".repeat(r.level || 0) + r.label;
          tr.appendChild(noteTd);
          tbody.appendChild(tr);
          return;
        }

        const labTd = document.createElement("td");
        const indent = "　".repeat(r.level || 0);
        if (r.isToggle){
          const btn = document.createElement("button");
          btn.type = "button"; btn.className = "subtoggle"; btn.textContent = "+";
          btn.setAttribute("aria-expanded","false"); btn.title = r.label + " 세부 펼치기";
          labTd.appendChild(document.createTextNode(indent + r.label + " "));
          labTd.appendChild(btn);
          btns[r.toggleGroup] = { btn, label: r.label };
        } else {
          labTd.textContent = indent + r.label;
        }
        if (r.bold) labTd.style.fontWeight = "700";
        tr.appendChild(labTd);
        r.cells.forEach(c=>{
          const td = document.createElement("td"); td.className = "num"; td.textContent = c;
          if (r.bold) td.style.fontWeight = "700";
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      // 그룹을 접을 때 그 안에 중첩된 하위 토글(예: 이익잉여금→준비금)도 같이 접어 상태를 초기화 —
      // 안 그러면 상위를 접었다 다시 펼쳤을 때 하위가 이미 펼쳐진 채로 나타나 혼란스럽다.
      function collapseGroup(groupKey){
        for (const m of (groups[groupKey] || [])) m.style.display = "none";
        rowDefs.forEach(r=>{
          if (r.group===groupKey && r.isToggle && btns[r.toggleGroup]){
            collapseGroup(r.toggleGroup);
            const nb = btns[r.toggleGroup].btn;
            nb.textContent = "+"; nb.setAttribute("aria-expanded","false");
            nb.title = btns[r.toggleGroup].label + " 세부 펼치기";
          }
        });
      }

      rowDefs.forEach(r=>{
        if (!r.isToggle) return;
        const entry = btns[r.toggleGroup]; if (!entry) return;
        entry.btn.addEventListener("click", ()=>{
          const members = groups[r.toggleGroup] || [];
          if (!members.length) return;
          const showing = members[0].style.display !== "none";
          if (showing) collapseGroup(r.toggleGroup);
          else members.forEach(m=> m.style.display = "");
          entry.btn.textContent = showing ? "+" : "−";

          maintainAspectRatio: false,
          plugins: {
            title: { display: true, text: "CSM 시계열 · " + shortName(coName) },
            legend: {
              display: true,
              position: window.innerWidth < 640 ? "bottom" : "top",
              labels: {
                filter: (item) => {
                  // hide the 22 background lines from legend
                  const ds = item && item.datasetIndex;
                  if (ds == null) return true;
                  const dataset = charts.hist && charts.hist.data.datasets[ds];
                  return dataset && !dataset._bg;
                },
              },
            },
            tooltip: {
              mode: "index",
              intersect: false,
              filter: (ctx) => {
                const ds = ctx.dataset;
                return ds && !ds._bg;  // only show selected company in tooltip
              },
              callbacks: {
                label: (ctx) => `${ctx.dataset.label}: ${fmtNum(ctx.parsed.y, 2)}조`,
                afterLabel: (ctx) => {
                  const sp = ctx.dataset._spans && ctx.dataset._spans[ctx.dataIndex];
                  return (sp && sp > 1) ? `  (${sp}개 분기 합산 — 중간 분기 미공시)` : undefined;
                },
              },
            },
          },
          interaction: { mode: "nearest", axis: "x", intersect: false },
          scales: {
            y: {
              type: "linear", position: "left", beginAtZero: false,
              min: histYMin, max: histYMax,
              title: { display: true, text: "기말 CSM (조원)", color: currentKey.line },
              ticks: { callback: (v) => fmtNum(v, 1) + "조", color: currentKey.line },
              grid: { color: currentKey.soft },
            },
            y1: {
              type: "linear", position: "right", beginAtZero: true,
              title: { display: true, text: "신계약 CSM (당기 증분, 조원)", color: "rgb(255, 99, 132)" },
              ticks: { callback: (v) => fmtNum(v, 2) + "조", color: "rgb(255, 99, 132)" },
              grid: { drawOnChartArea: false },
            },
            x: { title: { display: true, text: wfMode==="quarter" ? "분기" : "연도" } },
          },
        },
      });
    }

    renderBsSection(host, company);
    renderBsTable(host, company, wfMode);
  }

  function onSelect(){
    const sel=document.getElementById("company");
    const v=sel&&sel.value;
    const dash=document.getElementById("dashHost");
    const hint=document.getElementById("emptyHint");
    if(!v){
      destroyCharts();
      const _sw=document.getElementById("coSwatch"); if(_sw) _sw.style.background="transparent";
      const _cs=document.getElementById("company"); if(_cs){ _cs.style.borderColor=""; _cs.style.boxShadow=""; }
      dash.style.display="none"; hint.style.display="block"; dash.innerHTML=""; return;
    }
    dash.style.display="block"; hint.style.display="none";
    renderCompany(v);
  }

  async function boot(){
    // D10: 9개 JSON을 직렬 await → Promise.all 병렬(진입 로딩 지연 경감). 로딩 힌트 표시.
    const _eh=document.getElementById("emptyHint");
    if (_eh) _eh.textContent="데이터 불러오는 중…";
    const [wf, amort, plx, senx, nbx, wfxRaw, plxRaw, nbmRaw, eqxRaw] = await Promise.all([
      fetchJsonSafe(PATHS.wf), fetchJsonSafe(PATHS.amort), fetchJsonSafe(PATHS.pl),
      fetchJsonSafe(PATHS.sen), fetchJsonSafe(PATHS.nb),
      fetchJsonSafe(PATHS.wfx), fetchJsonSafe(PATHS.plx), fetchJsonSafe(PATHS.nbm),
      fetchJsonSafe(PATHS.eqx),
    ]);
    if (_eh) _eh.textContent="보험사를 선택해 주세요";

    payload.wf=wf; payload.amort=amort; payload.pl=plx; payload.sen=senx; payload.nb=nbx;

    // ⚠ null을 0으로 바꾸지 않는다 — 아래 wfx/plx/eqx 세 인덱스 빌더가 전부 이걸 쓴다.
    // Number(null)===0 이고 Number.isFinite(0)===true 라 그냥 Number()를 태우면
    // **미공시 셀이 전부 진짜 0으로 둔갑한다.** 세 마스터 모두 진짜 0이 섞여 있어 둘은 반드시
    // 구분돼야 한다 — 결측은 회색 "미공시" 막대/"—", 0은 높이 0인 실선/"0".
    // 실측(2026-08-28): PL_breakdown 값 null 1,347셀·값_당분기 null 2,377셀(진짜 0은 836셀) /
    // CSM_waterfall 값 null 2셀·값_당분기 null 200셀(진짜 0은 5셀) / IFRS17_BS 값 null 0셀
    // (진짜 0은 135셀 — 지금은 잠재버그 가드지만 파서가 null을 내보내는 순간 발화한다).
    const _num = v => (v==null || v==="") ? null : (Number.isFinite(Number(v)) ? Number(v) : null);

    // Panel 1/2 long-format index: CODE -> quarter -> 항목번호 -> 값  (+ 코드↔이름 등록부)
    if (Array.isArray(wfxRaw)){
      for (const r of wfxRaw){
        const code=r&&r["원보험사코드"], qq=r&&r["공시분기"], num=r&&r["항목번호"];
        if(!code||!qq||num==null) continue;
        if(r["원수사명"]) codeToName[code]=r["원수사명"];
        let byQ=ix.wfx.get(code); if(!byQ){ byQ=new Map(); ix.wfx.set(code,byQ); }
        let byN=byQ.get(qq); if(!byN){ byN=new Map(); byQ.set(qq,byN); }
        byN.set(num, { y:_num(r["값"]), q:_num(r["값_당분기"]) });
      }
    }

    // Panel 5 long-format index: CODE -> quarter -> 항목번호(string) -> {y:값, q:값_당분기}
    if (Array.isArray(plxRaw)){
      for (const r of plxRaw){
        const code=r&&r["원보험사코드"], qq=r&&r["공시분기"], num=r&&r["항목번호"];
        if(!code||!qq||num==null) continue;
        if(!codeToName[code] && r["원수사명"]) codeToName[code]=r["원수사명"];
        let byQ=ix.plx.get(code); if(!byQ){ byQ=new Map(); ix.plx.set(code,byQ); }
        byQ.get(qq) || byQ.set(qq, new Map());
        // nm(항목명)은 LOB 라벨 폴백에서만 읽는다(plItemName) — 값 계산 경로는 안 쓴다.
        byQ.get(qq).set(String(num), { y:_num(r["값"]), q:_num(r["값_당분기"]), nm:r["항목명"] });
      }
    }

    // Panel 1 BS T자 index: CODE -> quarter -> [{num,name,value,section,level}] (IFRS17_BS.json).
    // 섹션/레벨은 parser가 곧 실컬럼으로 얹을 계약(owner 20260814T1250Z) — 지금은 없으므로
    // EQ_SECTION_LEVEL_BRIDGE로 항목 1-7만 임시 매핑. 실컬럼이 오면 그 값이 그대로 우선한다.
    // 커버리지가 wfx/plx와 다른 회사도 있어 신규 코드가 여기서 처음 등록될 수 있음 — 드롭다운에 반영되는 게 맞음.
    if (Array.isArray(eqxRaw)){
      for (const r of eqxRaw){
        const code=r&&r["원보험사코드"], qq=r&&r["공시분기"], num=r&&r["항목번호"];
        if(!code||!qq||num==null) continue;
        if(!codeToName[code] && r["원수사명"]) codeToName[code]=r["원수사명"];
        const bridge = EQ_SECTION_LEVEL_BRIDGE[num];
        const section = r["섹션"] || (bridge ? bridge[0] : null);
        const level = r["레벨"]!=null ? Number(r["레벨"]) : (bridge ? bridge[1] : null);
        let byQ=ix.eqx.get(code); if(!byQ){ byQ=new Map(); ix.eqx.set(code,byQ); }
        let arr=byQ.get(qq); if(!arr){ arr=[]; byQ.set(qq,arr); }
        arr.push({ num, name:r["항목명"], value:_num(r["값"]), section, level });
      }
    }

    // NB CSM 배수 마스터: code -> [rows] (공시분기 오름차순). Panel 5 시계열 (2026.1Q까지, 35사).
    if (Array.isArray(nbmRaw)){
      for (const r of nbmRaw){
        const code=r&&r["원보험사코드"]; if(!code) continue;
        if(!codeToName[code] && r["원수사명"]) codeToName[code]=r["원수사명"];
        let a=ix.nbm.get(code); if(!a){ a=[]; ix.nbm.set(code,a); }
        a.push(r);
      }
      for (const a of ix.nbm.values()) a.sort((x,y)=>{ const px=wfParseQ(x["공시분기"]), py=wfParseQ(y["공시분기"]); return px[0]!==py[0]?px[0]-py[0]:px[1]-py[1]; });
    }

    // 코드 없는 옛 viz(amort/sen)·NB는 boot에서 code로 재키잉(이름 정규화 1회 → 이후 전부 코드).
    const reindexByCode = (companies) => {
      const m = new Map();
      for (const c of (companies||[])){ if(!c||!c.company) continue; const code=codeForName(c.company); if(code && !m.has(code)) m.set(code, [c]); }
      return m;
    };
    ix.amort = reindexByCode(amort && amort.companies);
    ix.sen   = reindexByCode(senx && senx.companies);
    ix.pl    = indexRows(plx && plx.companies); // legacy(미사용)
    for (const nm in NB_LOOKUP){ const code=codeForName(nm); if(code) nbByCode[code]=NB_LOOKUP[nm]; }

    // D-2 20260818(owner): 하드코딩된 "2023.1Q~2026.1Q"가 3곳(h2/aria-label/이 줄)에 복사돼 있어
    // 분기가 바뀔 때마다 어긋났다 — 전사 wfx 최소/최대 분기를 여기서 한 번만 계산해 공유.
    let gMin=null, gMax=null;
    for (const byQ of ix.wfx.values()){
      for (const qq of byQ.keys()){
        if (gMax==null || wfCmpDesc(qq,gMax)<0) gMax=qq;
        if (gMin==null || wfCmpDesc(qq,gMin)>0) gMin=qq;
      }
    }
    CSM_RANGE_LABEL = (gMin && gMax) ? (gMin+" ~ "+gMax) : "";
    const footerQEl = document.getElementById("footerQ");
    if (footerQEl && gMax) footerQEl.textContent = gMax;

    const line = document.getElementById("wfPeriodLine");
    if (line) line.textContent = ix.wfx.size ? ("CSM 워터폴 커버리지: "+ix.wfx.size+"개사 · "+CSM_RANGE_LABEL+" · 연 누계(YTD) 기준") : "";

    // 드롭다운: 회사코드(KR0001…) 순 정렬, value=코드, 표시=이름
    const codes = Object.keys(codeToName).sort();
    const sel=document.getElementById("company");
    for (let i=sel.options.length-1;i>=1;i--) sel.remove(i);
    for (const code of codes){
      const opt=document.createElement("option"); opt.value=code; opt.textContent=shortName(codeToName[code]); sel.appendChild(opt)
    }
    sel.addEventListener("change", onSelect);
    // 오류 제보를 지금 보고 있는 회사로 프리필해서 연다(우하단 버튼은 백업). 이 페이지는
    // BS·CSM워터폴·상각·NB배수를 함께 보여줘 시트 하나로 못 좁혀 회사만 채운다.
    const reportBtn = document.getElementById("reportThisBtn");
    if (reportBtn) reportBtn.addEventListener("click", () => {
      if (window.IQreport) window.IQreport.open({ company: codeToName[sel.value] || undefined });
    });
    const perSel=document.getElementById("wfPeriod");
    if (perSel) perSel.addEventListener("change", ()=>{ if (sel.value) renderCompany(sel.value); });
    window.addEventListener("resize", ()=>{ if (charts.wf) charts.wf.resize(); if (charts.pl) charts.pl.resize(); });
    // Re-render on mobile/desktop breakpoint cross so the amort chart switches 5y <-> 10y.
    window.matchMedia("(max-width:640px)").addEventListener("change", ()=>{ if (sel.value) renderCompany(sel.value); });

    // F1: auto-select company from URL param (?company=...). Used by
    // index.html bubble click → IFRS17 cross-nav.
    try {
      const params = new URLSearchParams(window.location.search);
      const wantedRaw = params.get("company");
      if (wantedRaw){
        const wanted = decodeURIComponent(wantedRaw);
        const pickCode = codeToName[wanted] ? wanted : codeForName(wanted); // 코드 또는 이름 허용
        if (pickCode){
          sel.value = pickCode;
          onSelect();
        } else {
          const hint=document.getElementById("emptyHint");
          if (hint) hint.textContent = "URL의 회사 '"+wanted+"'를 코호트에서 찾지 못했어. 위 드롭다운에서 직접 선택해줘.";
        }
      }
    } catch (e) { /* URL parse safe-guard */ }
  }

  boot().catch(()=>{
    const hint=document.getElementById("emptyHint");
    if (hint) hint.textContent="JSON 패치를 불러오지 못했습니다. http 로컬 서버로 파일을 여세요.";
  })
})();

</script>

    자료: 금융감독원 정기경영공시 · DART 전자공시 · 보험개발원 — 회사별 최신 공시 분기 기준 (<span id="footerQ">2026.1Q</span>)<br/>

<script>
(function(){
  if(!window.IntersectionObserver) return;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const obs=new IntersectionObserver((ens,o)=>{ens.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');o.unobserve(e.target);}});},{threshold:0.08,rootMargin:'0px 0px -12px 0px'});
  function observe(root){(root||document).querySelectorAll('.panel:not(.will-reveal)').forEach(p=>{p.classList.add('will-reveal');obs.observe(p);});}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>observe());
  else observe();
  window._revealPanels=observe;
})();
</script>
