<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>손해율 가정 curve 모바일 목업</title>
<link rel="stylesheet" href="../../../common.css"/>
<script src="../../../theme.js"></script>
<style>
  /* 목업: 모바일(375px) 손해율 가정 curve 간단 비교 2안. 데이터는 실제 data/compare/panel_compare.json 을 fetch 한다.
     ?opt=A|B  ?set=diff|sim (곡선이 다른 조합 / 비슷한 조합)  ?n=2~4 (회사 수) */
  *{box-sizing:border-box}
  :root{ --l0:#0f6e68; --l1:#b4481f; --l2:#3a63c4; --l3:#8a6c0a; --medc:#63666b; }
  :root[data-theme="dark"]{ --l0:#54b3aa; --l1:#f0946f; --l2:#8fb0f0; --l3:#e0c35a; --medc:#9ba09c; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --l0:#54b3aa; --l1:#f0946f; --l2:#8fb0f0; --l3:#e0c35a; --medc:#9ba09c; } }
  body{margin:0;background:var(--bg);color:var(--text)}
  .wrap{max-width:420px;margin:0 auto;padding:12px 16px 32px}
  h1{font-size:16px;margin:0 0 2px}
  .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
  .mock-tag{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:99px;padding:1px 8px;color:var(--muted);margin-bottom:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding:0;list-style:none}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border:1px solid var(--border);border-left:4px solid var(--c);border-radius:8px}
  .card{border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;background:var(--bg)}
  .card h3{font-size:14px;margin:0 0 2px}
  .card .def{font-size:12px;color:var(--muted);margin:0 0 8px}
  svg{display:block;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  svg text{font-family:inherit}
  .t{fill:var(--text)} .m{fill:var(--muted)}
  table.rd{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  table.rd th{font-weight:600;color:var(--muted);text-align:right;padding:3px 0;border-bottom:1px solid var(--border)}
  table.rd th:first-child{text-align:left}
  table.rd td{padding:5px 0;text-align:right;font-variant-numeric:tabular-nums}
  table.rd td:first-child{text-align:left}
  .sw{display:inline-block;width:14px;height:0;border-top:3px solid var(--c);vertical-align:middle;margin-right:6px}
  .sw.dash{border-top-style:dashed}
  .note{font-size:11px;color:var(--muted);margin:8px 0 0}
  /* 안 B */
  .sm{display:grid;grid-template-columns:84px 1fr 56px;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
  .sm:first-of-type{border-top:0}
  .sm .nm{font-size:12px;font-weight:600;border-left:4px solid var(--c);padding-left:6px;line-height:1.25}
  .sm .nm small{display:block;white-space:nowrap;font-weight:400;color:var(--muted);font-size:10px}
  .sm .v{text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .sm .v small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
  .hd{display:grid;grid-template-columns:84px 1fr 56px;gap:8px;font-size:11px;color:var(--muted);padding-bottom:4px}
  .hd span:last-child{text-align:right}
  details{margin-top:8px;font-size:12px}
  summary{cursor:pointer;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <span class="mock-tag" id="tag">목업</span>
  <h1 id="ttl">손해율 가정 (경과차년별)</h1>
  <p class="sub" id="sub"></p>
  <ul class="chips" id="chips"></ul>
  <article class="card" id="card"><h3>손해율 가정 (경과차년별)<span class="m" style="font-weight:400"> · %</span></h3>
    <p class="def" id="def"></p><div id="body"></div></article>
</div>
<script>
(function(){
  var P = new URLSearchParams(location.search), OPT = (P.get('opt') || 'A').toUpperCase(), SET = P.get('set') || 'diff';
  var SETS = {
    diff: ['메리츠화재', '삼성화재', '하나손보', '신한EZ손해'],    /* 곡선이 많이 다른 조합 (손보) */
    sim:  ['한화생명', '삼성생명', '교보생명', '신한라이프']          /* 비슷한 조합 (생보) */
  };
  var NAMES = (SETS[SET] || SETS.diff).slice(0, Math.max(2, Math.min(4, +(P.get('n') || 4))));
  var COLORS = ['var(--l0)', 'var(--l1)', 'var(--l2)', 'var(--l3)'];
  var DASH = ['', '6 3', '2 3', '10 3 2 3'];                         /* 색 외에 선 모양도 다르게(안 A) */
  var LR_END_X = 33, SVGNS = 'http://www.w3.org/2000/svg';
  function nf(v, d){ var s = Math.abs(v).toFixed(d == null ? 1 : d); return (v < 0 ? '△' : '') + s; }   /* 음수는 △ */
  function lrX(lab){ var m = /^(\d+)년$/.exec(lab); if(m) return +m[1]; m = /^(\d+)~(\d+)년$/.exec(lab); if(m) return (+m[1] + +m[2]) / 2; return LR_END_X; }
  function el(n, a, txt){ var e = document.createElementNS(SVGNS, n); for(var k in a) e.setAttribute(k, a[k]); if(txt != null) e.textContent = txt; return e; }

  fetch('../../../data/compare/panel_compare.json').then(function(r){ return r.json(); }).then(function(D){
    var C = D.loss_curve, nstd = C.n_std, labs = C.labels, Q = D.meta.quarters;
    var pvm = D.metrics.filter(function(m){ return m.id === 'loss_pv'; })[0];
    var byName = {}; D.companies.forEach(function(c){ byName[c.short] = c; });
    var xs = []; for(var i = 0; i < nstd; i++) xs.push(lrX(labs[i]));
    var asof = -1; Object.keys(pvm.v).forEach(function(c){ pvm.v[c].forEach(function(v, j){ if(v != null && j > asof) asof = j; }); });
    var type = byName[NAMES[0]].type;
    var S = NAMES.map(function(nm, k){
      var co = byName[nm], byQ = C.v[co.code] || {}, row = null, qi = -1;
      for(var j = asof; j >= 0; j--){ if(byQ[Q[j]]){ row = byQ[Q[j]]; qi = j; break; } }
      var coarse = row && row[nstd] != null, pts = [];
      for(var i2 = 0; i2 < nstd; i2++) pts.push(row ? (coarse && i2 < 10 ? row[nstd] : row[i2]) : null);
      var pv = null; for(var j2 = asof; j2 >= 0; j2--){ if(pvm.v[co.code][j2] != null){ pv = pvm.v[co.code][j2]; break; } }
      return {nm: nm, c: COLORS[k], dash: DASH[k], pts: pts, coarse: coarse, pv: pv, q: qi};
    });
    var med = null; for(var jm = asof; jm >= 0; jm--){ var r2 = C.med[type] && C.med[type][Q[jm]]; if(r2){ med = r2; break; } }
    var medPv = pvm.med[type] ? pvm.med[type][asof] : null;
    document.getElementById('tag').textContent = '목업 · 안 ' + OPT + ' · ' + (SET === 'sim' ? '비슷한 조합' : '다른 조합');
    document.getElementById('sub').textContent = Q[asof] + ' 결산 기준, 회사마다 가장 최근 공시';
    document.getElementById('def').textContent = '합계 포트폴리오의 예상보험금 ÷ 위험보험료, 미래 가정치 · 연 1회 공시 · 최신 공시 ' + Q[asof];
    document.getElementById('chips').innerHTML = S.map(function(s){ return '<li class="chip" style="--c:' + s.c + '">' + s.nm + '</li>'; }).join('');

    var all = []; S.forEach(function(s){ s.pts.forEach(function(v){ if(v != null) all.push(v); }); }); if(med) med.forEach(function(v){ if(v != null) all.push(v); });
    var lo = Math.floor((Math.min.apply(null, all) - 2) / 10) * 10, hi = Math.ceil((Math.max.apply(null, all) + 2) / 10) * 10;
    var body = document.getElementById('body');

    function pathOf(pts, X, Y){
      var d = '', pen = false;
      pts.forEach(function(v, i){ if(v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
      return d;
    }
    function ticks(){ var t = [], step = (hi - lo) > 80 ? 40 : (hi - lo) > 30 ? 20 : 10; for(var v = Math.ceil(lo / step) * step; v <= hi; v += step) t.push(v); return t; }

    function renderA(){
      var W = body.clientWidth || 319, H = 240, ml = 4, mr = 92, mt = 16, mb = 26, pw = W - ml - mr, ph = H - mt - mb;
      function X(x){ return ml + pw * x / LR_END_X; } function Y(v){ return mt + ph * (1 - (v - lo) / (hi - lo)); }
      var svg = el('svg', {viewBox: '0 0 ' + W + ' ' + H, role: 'img',
        'aria-label': '손해율 가정 경과차년별 꺾은선. ' + S.map(function(s){ var a = s.pts.filter(function(v){ return v != null; }); return s.nm + ' ' + nf(a[0]) + '%에서 ' + nf(a[a.length - 1]) + '%'; }).join('. ')});
      ticks().forEach(function(v){
        svg.appendChild(el('line', {x1: ml, x2: ml + pw, y1: Y(v), y2: Y(v), stroke: 'var(--border)', 'stroke-width': v === 100 ? 1.5 : 1, 'stroke-dasharray': v === 100 ? '' : '2 3'}));
        svg.appendChild(el('text', {x: ml + 2, y: Y(v) - 3, 'font-size': 10, class: 'm'}, nf(v, 0) + '%'));
      });
      if(med) svg.appendChild(el('path', {d: pathOf(med, X, Y), fill: 'none', stroke: 'var(--medc)', 'stroke-width': 1.5, 'stroke-dasharray': '1 4', 'stroke-linecap': 'round', opacity: .9}));
      S.forEach(function(s){
        svg.appendChild(el('path', {d: pathOf(s.pts, X, Y), fill: 'none', stroke: s.c, 'stroke-width': 2.5, 'stroke-dasharray': s.dash, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'}));
      });
      /* x: 눈금 숫자 없음, 시작·끝 라벨만 */
      svg.appendChild(el('text', {x: ml + 2, y: H - 8, 'font-size': 10, class: 'm'}, '1년'));
      svg.appendChild(el('text', {x: ml + pw, y: H - 8, 'font-size': 10, class: 'm', 'text-anchor': 'end'}, '30년 이후'));
      svg.appendChild(el('text', {x: ml + pw / 2, y: H - 8, 'font-size': 10, class: 'm', 'text-anchor': 'middle'}, '경과차년 →'));
      /* 선 끝 직접 라벨(겹치면 밀어낸다) */
      var ends = S.map(function(s, k){ var last = s.pts[nstd - 1]; return {k: k, y: last == null ? null : Y(last), v: last}; }).filter(function(e){ return e.y != null; });
      if(med){ var ml2 = med[nstd - 1]; if(ml2 != null) ends.push({k: -1, y: Y(ml2), v: ml2}); }
      ends.sort(function(a, b){ return a.y - b.y; });
      var gap = 27; for(var i = 1; i < ends.length; i++){ if(ends[i].y - ends[i - 1].y < gap) ends[i].y = ends[i - 1].y + gap; }
      var over = ends.length ? ends[ends.length - 1].y - (H - mb) : 0; if(over > 0) ends.forEach(function(e){ e.y -= over; });
      ends.forEach(function(e){
        var s = e.k >= 0 ? S[e.k] : null, col = s ? s.c : 'var(--medc)', x0 = ml + pw + 6;
        svg.appendChild(el('line', {x1: X(LR_END_X), y1: Y(e.v), x2: x0, y2: e.y, stroke: col, 'stroke-width': 1}));
        svg.appendChild(el('text', {x: x0 + 2, y: e.y - 1, 'font-size': 11, 'font-weight': 600, class: 't'}, s ? s.nm : (type + ' 중앙값')));
        svg.appendChild(el('text', {x: x0 + 2, y: e.y + 11, 'font-size': 11, class: 'm'}, nf(e.v) + '%'));
      });
      var g = el('g', {}); svg.appendChild(g);
      body.innerHTML = ''; body.appendChild(svg);
      var tb = document.createElement('div'); body.appendChild(tb);
      function table(idx){
        tb.innerHTML = '<table class="rd"><thead><tr><th>회사</th><th>현재가치</th><th>' + (idx == null ? '짚은 시점' : labs[idx]) + '</th></tr></thead><tbody>' +
          S.map(function(s){ return '<tr><td><span class="sw ' + (s.dash ? 'dash' : '') + '" style="--c:' + s.c + '"></span>' + s.nm + '</td><td><b>' + (s.pv == null ? 'n/a' : nf(s.pv) + '%') + '</b></td><td>' +
            (idx == null || s.pts[idx] == null ? '–' : nf(s.pts[idx]) + '%') + '</td></tr>'; }).join('') + '</tbody></table>';
      }
      table(null);
      function at(ev){
        var r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width), x = (px - ml) / pw * LR_END_X, best = 0;
        xs.forEach(function(v, i){ if(Math.abs(v - x) < Math.abs(xs[best] - x)) best = i; });
        g.innerHTML = ''; g.appendChild(el('line', {x1: X(xs[best]), x2: X(xs[best]), y1: mt, y2: H - mb, stroke: 'var(--text)', 'stroke-width': 1}));
        S.forEach(function(s){ if(s.pts[best] != null) g.appendChild(el('circle', {cx: X(xs[best]), cy: Y(s.pts[best]), r: 3.5, fill: s.c, stroke: 'var(--bg)', 'stroke-width': 1.5})); });
        table(best);
      }
      svg.addEventListener('pointerdown', at); svg.addEventListener('pointermove', function(e){ if(e.buttons || e.pointerType === 'touch') at(e); });
    }

    function renderB(){
      var W = Math.max(120, (body.clientWidth || 319) - 84 - 56 - 16), H = 44, ml = 2, mr = 2, mt = 4, mb = 4, pw = W - ml - mr, ph = H - mt - mb;
      function X(x){ return ml + pw * x / LR_END_X; } function Y(v){ return mt + ph * (1 - (v - lo) / (hi - lo)); }
      body.innerHTML = '<div class="hd"><span>회사</span><span>경과차년 1년 → 30년 이후 <span id="yh"></span></span><span>현재가치</span></div>';
      var gs = [];
      function row(s, isMed){
        var pts = isMed ? med : s.pts, col = isMed ? 'var(--medc)' : s.c, pv = isMed ? medPv : s.pv, nm = isMed ? type + ' 중앙값' : s.nm;
        var a = pts.filter(function(v){ return v != null; });
        var d = document.createElement('div'); d.className = 'sm'; d.style.setProperty('--c', col);
        d.innerHTML = '<div class="nm">' + nm + '<small>' + nf(a[0]) + ' → ' + nf(a[a.length - 1]) + '</small></div><div class="sp"></div><div class="v">' + (pv == null ? 'n/a' : nf(pv) + '%') + '</div>';
        var svg = el('svg', {viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': nm + ' 손해율 가정 ' + nf(a[0]) + '%에서 ' + nf(a[a.length - 1]) + '%, 현재가치 ' + (pv == null ? 'n/a' : nf(pv) + '%')});
        svg.appendChild(el('line', {x1: ml, x2: ml + pw, y1: Y(100), y2: Y(100), stroke: 'var(--border)', 'stroke-dasharray': '2 3'}));
        svg.appendChild(el('path', {d: pathOf(pts, X, Y), fill: 'none', stroke: col, 'stroke-width': 2.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': isMed ? '1 4' : ''}));
        var g = el('g', {}); svg.appendChild(g); gs.push({g: g, pts: pts, X: X, Y: Y, col: col, vEl: d.querySelector('.v'), pv: pv});
        d.querySelector('.sp').appendChild(svg); body.appendChild(d);
        svg.addEventListener('pointerdown', scrub); svg.addEventListener('pointermove', function(e){ if(e.buttons || e.pointerType === 'touch') scrub(e); });
        return svg;
      }
      function scrub(ev){
        var r = ev.currentTarget.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width), x = (px - ml) / pw * LR_END_X, best = 0;
        xs.forEach(function(v, i){ if(Math.abs(v - x) < Math.abs(xs[best] - x)) best = i; });
        document.getElementById('yh').textContent = '· ' + labs[best];
        gs.forEach(function(o){
          o.g.innerHTML = ''; o.g.appendChild(el('line', {x1: o.X(xs[best]), x2: o.X(xs[best]), y1: 2, y2: H - 2, stroke: 'var(--text)', 'stroke-width': 1}));
          if(o.pts[best] != null){ o.g.appendChild(el('circle', {cx: o.X(xs[best]), cy: o.Y(o.pts[best]), r: 3.5, fill: o.col, stroke: 'var(--bg)', 'stroke-width': 1.5})); o.vEl.innerHTML = nf(o.pts[best]) + '%<small>' + labs[best] + '</small>'; }
        });
      }
      S.forEach(function(s){ row(s, false); }); if(med) row(null, true);
      var n = document.createElement('p'); n.className = 'note'; n.textContent = '점선은 100%. 모든 줄이 같은 세로 눈금(' + nf(lo, 0) + '~' + nf(hi, 0) + '%)입니다. 줄을 짚고 끌면 모든 줄의 같은 경과차년 값이 오른쪽 숫자 자리에 나옵니다.'; body.appendChild(n);
    }
    OPT === 'B' ? renderB() : renderA();
    var foot = [];
    foot.push('현재가치 손해율은 선에 넣지 않고 ' + (OPT === 'B' ? '오른쪽 숫자' : '아래 표') + '로 함께 둡니다(지금 모바일의 숫자 비교는 이 열로 유지).');
    var co = S.filter(function(s){ return s.coarse; }).map(function(s){ return s.nm; });
    if(co.length) foot.push(co.join(', ') + '은 경과 1~10년을 한 구간으로 공시해 평평하게 그렸습니다.');
    var p = document.createElement('p'); p.className = 'note'; p.innerHTML = foot.join('<br>'); document.getElementById('card').appendChild(p);
    document.documentElement.setAttribute('data-ready', '1');
  });
})();
</script>
</body>
</html>
