<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og mock 2</title>
<style>
  :root{--bg:#ffffff;--card:#f5f5f4;--border:#e4e4e2;--text:#18181b;--muted:#63666b;--ink-strong:#3f4347;--primary:#0f6e68}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  body{position:relative;font-family:'Pretendard Variable',Pretendard,'Segoe UI','Malgun Gothic','Noto Sans KR',sans-serif;color:var(--text)}
  .bar{position:absolute;left:0;top:0;width:1200px;height:10px;background:var(--primary)}
  .brand{position:absolute;left:64px;top:60px;font-size:34px;font-weight:800;letter-spacing:-0.4px;line-height:1}
  .brand .hint{display:block;margin:10px 0 0;font-size:20px;font-weight:400;color:var(--muted);letter-spacing:0}
  h1{position:absolute;left:64px;top:164px;width:500px;font-size:64px;font-weight:800;line-height:1.14;letter-spacing:-1.5px}
  h1 .accent{color:var(--primary)}
  .chips{position:absolute;left:64px;top:416px;display:flex;flex-wrap:wrap;gap:10px;width:500px}
  .chip{height:40px;padding:0 16px;display:flex;align-items:center;border:1px solid var(--border);background:var(--card);border-radius:999px;font-size:18px;font-weight:600;color:var(--ink-strong)}
  .foot{position:absolute;left:64px;bottom:60px;font-size:22px;font-weight:700;color:var(--muted);line-height:1}
  .foot span{font-weight:400;margin-left:10px}
  .p1{position:absolute;left:584px;top:64px}
  .p2{position:absolute;left:584px;top:320px}
  svg{display:block}
  svg text{font-family:'Pretendard Variable',Pretendard,'Segoe UI','Malgun Gothic','Noto Sans KR',sans-serif}
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="brand">InsureQuant<span class="hint">보험사 공시 대시보드</span></div>
  <h1>국내 보험사<br><span class="accent">K-ICS·IFRS17</span><br>현황 한눈에</h1>
  <div class="chips">
    <div class="chip">지급여력 마켓맵</div>
    <div class="chip">CSM 버블맵</div>
    <div class="chip">신계약 CSM 배수</div>
  </div>
  <div class="foot">www.insurequant.com<span>분기 공시 기반</span></div>

      <rect x="493" y="178" width="37"  height="36"  rx="3" fill="#a8362f"/>

</body>
</html>
